<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c">
<link rel="manifest" href="manifest.webmanifest?b=j1">
<link rel="icon" type="image/png" href="app-icon-192.png?b=j1">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png?b=j1">

<meta name="application-name" content="Hexfarers">
<meta name="description" content="Hexfarers: a hex-island trading and building game against AI bots. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hexfarers</title>
<style>
:root{--bg:#0b3d5c;--panel:#082c43;--btn:#12527a;--line:#1b5f8a;--modal:#0e3a57;--accent:#3b8cbf}
:root[data-theme=night]{--bg:#05070d;--panel:#02030a;--btn:#1a2438;--line:#2a3a5a;--modal:#0a1020;--accent:#5a7bb8}
:root[data-theme=parchment]{--bg:#3b2a1a;--panel:#2a1d12;--btn:#6b4a2b;--line:#8a6a43;--modal:#4a3321;--accent:#c9a368}
:root[data-theme=meadow]{--bg:#1b4332;--panel:#0f2a20;--btn:#2d6a4f;--line:#40916c;--modal:#1f4d3a;--accent:#74c69d}
.bubble{position:fixed;z-index:30;background:#fff;color:#111;border:2px solid #888;border-radius:12px;padding:5px 9px;font-size:13px;font-weight:600;max-width:190px;box-shadow:0 2px 8px #0008;pointer-events:none;transition:opacity .45s;opacity:1}
.bubble.out{opacity:0}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);max-width:900px;margin:0 auto}
#top{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}
.pl{border:2px solid;border-radius:8px;padding:2px 4px;font-size:11px;background:rgba(0,0,0,.25);line-height:1.3;min-width:0;white-space:nowrap;overflow:hidden}
.pl.cur{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px var(--pc),0 0 12px 2px var(--pc);animation:curglow 1.3s ease-in-out infinite}
@keyframes curglow{50%{box-shadow:0 0 0 2px var(--pc),0 0 4px 0 var(--pc)}}
.plw{min-width:0;display:flex;flex-direction:column;align-items:stretch}
.plw .arr{height:13px;line-height:13px;text-align:center;font-size:13px;visibility:hidden}
.plw .arr.on{visibility:visible;animation:arrb .8s ease-in-out infinite}
@keyframes arrb{50%{transform:translateY(-3px)}}
.pl b{font-size:12px}
.pl .pcs{font-size:10.5px;opacity:.85}
.pl .fl{color:#8dff9c;font-weight:800}
#boardwrap{flex:1;min-height:0;position:relative}
#board{width:100%;height:100%;display:block}
#gear{position:absolute;right:6px;top:6px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:19px}
#toast{position:absolute;left:50%;top:6%;transform:translate(-50%,-10px);background:rgba(8,32,50,.95);border:2px solid #ffd77a;border-radius:14px;padding:10px 16px;text-align:center;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;max-width:92%;line-height:1.45}
#toast.show{opacity:1;transform:translate(-50%,0)}
.cardbig{display:inline-block;background:#fff;color:#000;border-radius:8px;padding:6px 12px;font-size:30px;margin:4px 0;box-shadow:0 2px 6px #0008;border:2px solid #333}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid #fff}
#panel{background:var(--panel);padding:6px 8px;border-top:2px solid var(--line)}
#msgrow{display:grid;grid-template-columns:1fr minmax(130px,auto) 1fr;align-items:center;gap:6px;min-height:46px}
#msgrow.noend{grid-template-columns:1fr auto}
#msgrow.noend #endbtn{display:none}
#msgrow #dice{justify-self:end}
#msg{font-size:13px;font-weight:600;min-width:0;line-height:1.25}
#dice{display:flex;gap:7px;align-items:center}
#dice .dd{display:flex;gap:6px}
#dice .tot{font-size:20px;font-weight:800;min-width:24px;text-align:center}
.die{filter:drop-shadow(0 2px 2px #0009)}
.tumble .die{animation:tumble .35s linear infinite}
@keyframes tumble{to{transform:rotate(360deg)}}
#hand{display:flex;gap:6px;margin:5px 0}
.chip{flex:1;background:var(--btn);border-radius:8px;padding:3px 0;text-align:center;font-size:16px;position:relative}
.chip b{margin-left:4px;font-size:16px}
.chip.gain{animation:chipgain .5s}
.chip.loss{animation:chiploss .5s}
@keyframes chipgain{40%{transform:scale(1.25);background:#2e9e5b}}
@keyframes chiploss{40%{transform:scale(.88);background:#c62828}}
.pop{position:absolute;left:50%;top:-2px;font-weight:800;font-size:15px;color:#8dff9c;animation:popup 1.1s forwards;pointer-events:none;text-shadow:0 1px 2px #000;z-index:3}
.pop.neg{color:#ff8a80}
@keyframes popup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.lock{position:absolute;top:-7px;right:-3px;font-size:10px;background:#000b;border-radius:9px;padding:0 4px;font-style:normal}
.fly{position:fixed;left:0;top:0;font-size:24px;z-index:30;pointer-events:none;margin:-14px 0 0 -14px}
#btns{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#btns button,#mbox button{background:#2e9e5b;color:#fff;border:0;border-radius:8px;padding:7px 2px;font-size:13px;font-weight:600;line-height:1.15}
#btns button{position:relative}
#btns button .left{position:absolute;top:-5px;right:-3px;min-width:15px;padding:0 3px;border-radius:8px;background:#0b2a3f;border:1.5px solid rgba(255,255,255,.5);z-index:1;font-size:10.5px;font-weight:800;line-height:15px}
#btns button small{display:block;font-weight:400;font-size:10px;opacity:.9}
button:disabled{background:#3a5568!important;color:#8aa;opacity:.7}
button.ghost{background:#4a6a80!important}
#log{font-size:11px;color:#9cc;max-height:46px;overflow:auto;margin-top:5px}
.hit{animation:pulse 1s infinite;cursor:pointer}
@keyframes pulse{50%{opacity:.35}}
.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.flow{stroke-dasharray:10 8;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
#title{position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at 50% 40%,#1d6a99 0%,#0b3d5c 55%,#06253a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:16px}
#title.hidden{display:none}
#title .bgsvg{position:absolute;inset:0;width:100%;height:100%}
#title .wave{animation:wave 6s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-18px)}}
#title .isl{animation:bob 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-6px)}}
#title .tile{animation:tilein .7s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes tilein{from{transform:scale(0) rotate(-60deg);opacity:0}to{transform:none;opacity:1}}
#title .boat{animation:sail 18s linear infinite}
@keyframes sail{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
#title .islsvg{position:relative;width:min(230px,58vw);height:auto;margin-bottom:-6px;flex:none}
@media (max-height:640px){#title .islsvg{width:150px}}
#title .ttl{position:relative;font-size:clamp(40px,12vw,64px);font-weight:900;letter-spacing:2px;color:#ffd77a;text-shadow:0 3px 0 #8a5a12,0 6px 14px rgba(0,0,0,.55);margin:0;line-height:1;white-space:nowrap}
#title .ttl span{display:inline-block;animation:drop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{from{transform:translateY(-70px) scale(1.4);opacity:0}to{transform:none;opacity:1}}
#title .tag{position:relative;margin:8px 0 2px;font-size:15px;opacity:0;animation:fade .8s 1.1s forwards;text-align:center}
#title .ver{position:relative;font-size:11px;opacity:.6;margin-bottom:16px}
@keyframes fade{to{opacity:.9}}
#title .menu{position:relative;display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px;opacity:0;animation:fadeup .7s 1.3s forwards}
@keyframes fadeup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
#title .menu button{border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800;color:#fff;background:rgba(10,40,62,.85);box-shadow:0 3px 0 rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.12)}
#title .menu button.main{background:#2e9e5b;font-size:19px;padding:15px}
#title .menu button.cont{background:#c2571a}
#title .menu button:disabled{opacity:.45}
#title .menu .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#title .menu .two button{font-size:15px;padding:11px 6px}
#title .foot{position:relative;margin-top:14px;font-size:10.5px;opacity:.55;text-align:center;max-width:330px}
#devpop{position:fixed;inset:0;z-index:11;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#devpop.show{opacity:1;pointer-events:auto}
#devpop .dc{width:min(250px,70vw);border-radius:18px;padding:16px 14px 18px;text-align:center;background:linear-gradient(160deg,#fff8e1,#f3dfb0);color:#222;border:5px solid var(--pc,#ffd77a);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px var(--pc,#ffd77a);transform:scale(.3) rotateY(180deg);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
#devpop.show .dc{transform:none}
#devpop .who{font-weight:800;font-size:17px}
#devpop .ico{font-size:76px;line-height:1.15;margin:6px 0}
#devpop .nm{font-size:23px;font-weight:900;margin-bottom:6px}
#devpop .tapc{margin-top:12px;font-size:12px;font-weight:700;opacity:.55;animation:pulse 1.6s infinite}
#devpop .dc.ev{background:var(--modal);color:#fff;border-color:var(--accent);box-shadow:0 10px 40px rgba(0,0,0,.6);font-size:17px;line-height:1.45;font-weight:700;width:min(320px,86vw)}
#devpop .dc.ev .cardbig{font-size:34px}
#devpop .det{font-size:15px;line-height:1.35;color:#444}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
#modal.hidden{display:none}
#mbox{background:var(--modal);border:2px solid var(--accent);border-radius:14px;padding:14px;max-width:440px;width:100%;max-height:92dvh;overflow:auto}
#mbox h3{margin:0 0 8px}
#mbox .hdr{display:flex;justify-content:space-between;align-items:center}
#mbox .hdr button.ibtn{width:34px;height:34px;border-radius:50%;padding:0;font-size:18px;background:#1e88e5}
#mbox .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;justify-content:center}
#mbox .row button{flex:1;padding:10px 6px}
#mbox .seg{display:flex;gap:4px;margin:4px 0}
#mbox .seg button{flex:1;background:var(--btn);padding:9px 2px}
#mbox .seg button.on{background:#2e9e5b}
#mbox .seg button:disabled{opacity:.55}
#mbox input[type=range]{width:100%}
.tog{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:14px}
.tog input{width:20px;height:20px}
.stp{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
.stp .e{font-size:20px}.stp button{width:100%;padding:5px 0!important;flex:none!important}
.stp b{font-size:16px}
.sec{font-size:13px;opacity:.9;margin-top:10px;font-weight:600}
.small{font-size:12px;opacity:.85}
.note{min-height:18px;text-align:center;color:#ffd77a;font-size:13px}
.drow{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
.drow button{padding:7px 14px!important}
.big{font-size:20px}
#statbtn{position:absolute;left:6px;top:6px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px}
table.st{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
table.st th,table.st td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line)}
table.st td:first-child,table.st th:first-child{text-align:left}
table.st tr.sub td{opacity:.8;font-size:11px}
table.st tr.hd td{background:var(--btn);font-weight:700;text-align:left}
.sbrow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.sbrow>span{width:46px;font-weight:700}
.sbw{flex:1;display:flex;align-items:center;gap:6px}
.sb{display:flex;height:22px;border-radius:4px;overflow:hidden;min-width:2px}
.sb span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#111;overflow:hidden}
.lg{padding:1px 6px;border-radius:4px;margin-right:4px;font-size:13px;color:#111}
.good{color:#8dff9c}.bad{color:#ff8a80}
#board{touch-action:none}
#bank{position:absolute;left:6px;bottom:4px;font-size:11px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 7px;z-index:4;pointer-events:none;white-space:nowrap}
#bank .low{color:#ff8a80;font-weight:700}
#logbtn{position:absolute;left:6px;top:50px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px}
#top.many{grid-template-columns:repeat(3,1fr)}
.pl{cursor:pointer}
#sndbtn{position:absolute;left:6px;top:94px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px}
#xbar{position:absolute;left:6px;bottom:27px;font-size:12px;background:rgba(0,0,0,.55);border-radius:8px;padding:3px 8px;z-index:4;white-space:nowrap;cursor:pointer;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
#xbar:empty{display:none}
#endbtn{background:#c2571a;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:800;white-space:nowrap;width:100%;min-width:130px}
#dice.tapme{cursor:pointer;border-radius:10px;padding:2px 4px;box-shadow:0 0 0 2px #ffd77a;animation:dpulse 1.1s ease-in-out infinite}
@keyframes dpulse{50%{box-shadow:0 0 0 5px rgba(255,215,122,.35)}}
#dice .hint{font-size:11px;font-weight:700;color:#ffd77a}
.lg-r{margin:8px 0 2px;font-weight:800;color:#ffd77a;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.lg-l{font-size:13px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.logbox{max-height:58vh;overflow:auto;margin:6px 0}
.achg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.ach{background:var(--btn);border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.3}
.ach b{display:block;font-size:13px}
.ach.locked{opacity:.38;filter:grayscale(1)}
.crow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
#zoomctl{position:absolute;right:6px;top:50px;z-index:6;display:flex;flex-direction:column;gap:5px}
#zoomctl button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1;padding:0}
.resp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:8px;font-size:13px}
.resp button{padding:7px 14px!important;flex:none}
.resp.no{opacity:.65}
#mbox .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 4px;position:sticky;top:-2px;z-index:2;background:var(--panel);padding:2px 0}
#mbox .tabs button{background:var(--btn);padding:8px 2px;font-size:12px}
#mbox .tabs button.on{background:#2e9e5b}
#mbox .seg.lang{flex-wrap:wrap}
#mbox .seg.lang button{flex:1 1 30%}
.pbar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:#2e9e5b}
.pop-in{animation:popin .6s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes popin{from{transform:translateY(-28px) scale(1.6);opacity:0}55%{opacity:1}to{transform:none;opacity:1}}
.grow-in{animation:growin .45s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes growin{from{transform:scale(0);opacity:.2}to{transform:none;opacity:1}}
#mbox .bsg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
#mbox .bsg button{background:var(--btn);border:2px solid transparent;border-radius:10px;padding:3px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:0}
#mbox .bsg button.on{border-color:#2e9e5b;background:var(--line)}
.myhand{display:flex;gap:5px;margin:4px 0 6px}
.myhand span{flex:1;background:var(--btn);border-radius:8px;padding:4px 0;text-align:center;font-size:15px;line-height:1.2}
.myhand b{margin-left:3px}
.myhand small{display:block;font-size:11px;font-weight:700;min-height:13px}
body.side #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body.side #boardwrap{grid-column:1;grid-row:1/3}
body.side #top{grid-column:2;grid-row:1;grid-template-columns:repeat(2,1fr)}
body.side #panel{grid-column:2;grid-row:2;overflow:auto;border-top:0;border-left:2px solid var(--line)}
body.side #hand{flex-wrap:wrap}
body.side .chip{flex:1 1 27%}
@media (max-height:480px){body.side #log{display:none}}
.info p{margin:5px 0;font-size:13px;line-height:1.35}
.info h4{margin:10px 0 2px;font-size:14px;color:#ffd77a}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="boardwrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="toast"></div>
    <button id="gear" aria-label="Settings">⚙</button>
    <button id="statbtn" aria-label="Statistics">📊</button>
    <button id="logbtn" aria-label="Game log">📜</button>
    <button id="sndbtn" aria-label="Sound on or off">🔊</button>
    <div id="xbar"></div>
    <div id="bank"></div>
    <div id="zoomctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Reset zoom">⤢</button></div>
  </div>
  <div id="panel">
    <div id="msgrow"><div id="msg"></div><button id="endbtn" data-a="end">End turn</button><div id="dice"></div></div>
    <div id="hand"></div>
    <div id="btns"></div>
  </div>
</div>
<div id="title" class="hidden"></div>
<div id="devpop"><div class="dc"></div></div>
<div id="modal" class="hidden"><div id="mbox"></div></div>
<script>
'use strict';
/* ===== Hexfarers: a hex-island trading & building game (offline, vs AI) ===== */
const RES=['wood','brick','sheep','wheat','ore'];
const EMO={wood:'🌲',brick:'🧱',sheep:'🐑',wheat:'🌾',ore:'⛰️'};
const EMO0={...EMO};
const RSTYLES={classic:{name:'Classic',e:{wood:'🌲',brick:'🧱',sheep:'🐑',wheat:'🌾',ore:'⛰️'}},goods:{name:'Raw goods',e:{wood:'🪵',brick:'🧱',sheep:'🧶',wheat:'🌾',ore:'🪨'}},crafts:{name:'Crafted',e:{wood:'🌳',brick:'🏺',sheep:'🐏',wheat:'🍞',ore:'💎'}},letters:{name:'Letters',e:{wood:'Ⓦ',brick:'Ⓑ',sheep:'Ⓢ',wheat:'Ⓖ',ore:'Ⓞ'}}};
function applyRStyle(){Object.assign(EMO,(RSTYLES[S.rstyle]||RSTYLES.classic).e);}
const remo=t=>(!S.rstyle||S.rstyle==='classic'||typeof t!=='string')?t:t.split(/(<!--keep-->[\s\S]*?<!--\/keep-->)/).map(p=>p.startsWith('<!--keep-->')?p:p.replace(/🌲|🧱|🐑|🌾|⛰️/g,m=>EMO[RES.find(r=>EMO0[r]===m)]||m)).join('');

function musicTick(){
  const a=audio();if(!a||!MUS.on)return;
  const E8=.375;

    if(st%16===0)ch.forEach(n=>mvoice(mf(n),t,6.2,'triangle',.05,1.6,2));
    if(st%8===0)mvoice(mf(ch[0]-12),t,2.8,'sine',.12,.05,2);
    if(st%2===0&&Math.random()<.42){const n=Math.random()<.5?ch[Math.floor(Math.random()*3)]:PENTA[Math.floor(Math.random()*5)];mvoice(mf(n+24),t,1.3,'sine',.06,.01,1.1);}

    best=Math.max(best,len);
    if(len>0&&V[v].owner!==-1&&V[v].owner!==pid)return;
    for(const e of V[v].edges){

function checkWin(p){
  if(G.over)return;
  if(totVP(G.players[p])>=(G.vpWin||10)){G.over=true;G.winner=p;log(`${PNAME[p]} wins!`);snapStats();clearSave();recordGame();render();showWin();}
}
function distribute(s){
  const gain=G.players.map(emptyRes),src=G.players.map(()=>[]),gold=G.players.map(()=>0);
  for(let i=0;i<H.length;i++){
    const h=H[i];if(h.num!==s)continue;
    for(const v of h.verts){
      const o=V[v].owner;if(o===-1)continue;
      const n=V[v].city?2:1;
      if(i===G.robber){if(RES.includes(h.res))ST(o).blocked[h.res]+=n;continue;}
      if(h.res==='gold'){gold[o]+=n;continue;}
      gain[o][h.res]+=n;src[o].push({hi:i,res:h.res,n});
    }
  }
  // the bank holds a limited number of each resource (19, or 24 on the large map)
  for(const r of RES){
    const owed=G.players.filter(p=>gain[p.id][r]>0);
    const total=owed.reduce((a,p)=>a+gain[p.id][r],0);
    if(total<=G.bank[r])continue;
    if(owed.length===1){
      const o=owed[0].id,left=G.bank[r];
      ST(o).short+=gain[o][r]-left;gain[o][r]=left;
      log(`The bank only has ${left}${EMO[r]} left.`);
    }else{
      owed.forEach(p=>{ST(p.id).short+=gain[p.id][r];gain[p.id][r]=0;});
      log(`The bank is short of ${EMO[r]}: nobody collects it.`);
    }
    G.players.forEach(p=>{let left=gain[p.id][r];src[p.id]=src[p.id].filter(e=>{if(e.res!==r)return true;e.n=Math.min(e.n,left);left-=e.n;return e.n>0;});});
  }
  let any=false;
  gain.forEach((g,i)=>{const t=RES.filter(r=>g[r]).map(r=>g[r]+EMO[r]).join(' ');if(t){any=true;RES.forEach(r=>{G.players[i].res[r]+=g[r];G.bank[r]-=g[r];ST(i).gainDice[r]+=g[r];});log(`${PNAME[i]} gets ${t}`);}});
  if(!any&&!gold.some(x=>x))log('Nobody collects resources.');
  if(XM()==='fish'){
    const caught=G.players.map(()=>new Set());
    H.forEach((h,i)=>{if(h.num!==s||i===G.robber)return;for(const v of h.verts){const o=V[v].owner;if(o!==-1&&isCoast(v))caught[o].add(v);}});
    caught.forEach((st,i)=>{if(st.size){G.players[i].fish=(G.players[i].fish||0)+st.size;log(`${PNAME[i]} caught ${st.size}🐟`);}});
  }
  return {gain,src,gold};
}

/* ---------- animation helpers ---------- */
let toastTok=0;
async function toast(html,ms,scaled=true){
  if(quick()||ms<=0)return;
  const t=$('toast'),my=++toastTok;
  t.innerHTML=remo(html);t.classList.add('show');
  await(scaled?sleep(ms):pause(ms));
  if(my===toastTok)t.classList.remove('show');
}
function popChip(r,txt,neg){
  const c=document.querySelector('.chip[data-r="'+r+'"]');if(!c)return;
  const s=document.createElement('span');s.className='pop'+(neg?' neg':'');s.textContent=txt;c.appendChild(s);
  c.classList.add(neg?'loss':'gain');
}
function flyCard(fromEl,toEl,emoji){
  return new Promise(res=>{
    if(!fromEl||!toEl||!document.body.animate){res();return;}
    const d=document.createElement('div');d.className='fly';d.textContent=emoji;document.body.appendChild(d);
    const A=fromEl.getBoundingClientRect(),B=toEl.getBoundingClientRect();
    const fx=A.left+A.width/2,fy=A.top+A.height/2,tx=B.left+B.width/2,ty=B.top+B.height/2;
    const dur=750*Math.min(S.delay,1.6);
    d.animate([{transform:`translate(${fx}px,${fy}px) scale(1.5)`},{transform:`translate(${(fx+tx)/2}px,${Math.min(fy,ty)-30}px) scale(1.25)`,offset:.5},{transform:`translate(${tx}px,${ty}px) scale(.8)`}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
    setTimeout(()=>{d.remove();res();},dur+30);
  });
}
async function animateGains(s,gain,src,before){
  if(!gain.some(g=>sum(g)>0)){await sleep(350);return;}
  if(G.hl!==null&&!quick())await sleep(750);                // let the glowing tiles be seen first
  G.flash={};
  gain.forEach((g,i)=>{if(i!==0&&sum(g))G.flash[i]=RES.filter(r=>g[r]).map(r=>'+'+g[r]+EMO[r]).join(' ');});
  renderTop();
  if(!quick()&&sum(gain[0])){
    if(animOn()){
      G.shown={...before[0]};renderPanel();
      for(const e of src[0]){
        const ps=[];
        for(let i=0;i<e.n;i++)ps.push((async()=>{
          await pause(i*170);
          await flyCard(document.querySelector('[data-hx="'+e.hi+'"]'),document.querySelector('.chip[data-r="'+e.res+'"]'),EMO[e.res]);
          G.shown[e.res]++;renderPanel();popChip(e.res,'+1');sfx('card');
        })());
        await Promise.all(ps);
      }
      G.shown=null;renderPanel();
    }else{
      renderPanel();RES.forEach(r=>{if(gain[0][r])popChip(r,'+'+gain[0][r]);});sfx('card');
    }
  }
  if(Object.keys(G.flash).length)await sleep(600);
  G.flash=null;renderTop();
}

async function rollDice(p){
  sfx('roll');
  G.hl=null;if(G.rb&&G.rb.turnId!==G.turnId)G.rb=null;
  if(animOn()){
    G.rolling=true;
    for(let i=0;i<8;i++){G.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];renderPanel();await pause(70);}
    G.rolling=false;
  }
  const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),s=d1+d2;
  G.dice=[d1,d2];G.st.rolls[s]++;ST(p).turns++;if(s===7)ST(p).rolled7++;accrueExpected();
  log(`${PNAME[p]} rolled ${s}`);render();
  if(!quick())await sleep(350);
  if(s===7){
    const names=[];
    for(const q of G.players){const c=cards(q);if(c>RULE('hand')){const need=Math.floor(c/2);if(q.ai){autoDiscard(q,need);names.push(`${PNAME[q.id]} discarded ${need}`);}else await humanDiscard(q,need);}}
    render();
    if(names.length)await evPop(`<div style="font-size:30px">💥</div><div>Seven!</div>${names.map(n=>`<div class="small">${n}</div>`).join('')}`,1500);
    await robberSequence(p);
  }else{
    const before=G.players.map(pl=>({...pl.res}));
    const {gain,src,gold}=distribute(s);
    if(S.hl)G.hl=s;
    render();
    await animateGains(s,gain,src,before);
    if(gold.some(x=>x))await goldPicks(gold);
  }
  if(XM()==='barbarians')await barbStep();
  render();
}
function autoDiscard(q,need){
  for(let i=0;i<need;i++){const r=RES.slice().sort((a,b)=>q.res[b]-q.res[a])[0];q.res[r]--;G.bank[r]++;ST(q.id).lostDiscard[r]++;}
  log(`${PNAME[q.id]} discarded ${need} cards`);
}
async function robberSequence(p){
  const from=G.robber;
  let h;
  if(isAI(p)){await sleep(350);h=aiRobberHex(p);}else h=await pickBoard('robber');
  if(h==null)h=robberCands(p)[0];
  sfx('robber');G.fx={k:'r',at:Date.now()};G.robber=h;G.rb={from,to:h,turnId:G.turnId};ST(p).robberMoves++;log(`${PNAME[p]} moved the robber`);
  const victims=[...new Set(H[h].verts.map(v=>V[v].owner))].filter(o=>o!==-1&&o!==p&&cards(G.players[o])>0);
  let vic=null,stolen=null;
  if(victims.length===1)vic=victims[0];
  else if(victims.length>1){
    if(isAI(p))vic=G.diff==='easy'?victims[Math.floor(Math.random()*victims.length)]:victims.sort((a,b)=>totVP(G.players[b])-totVP(G.players[a]))[0];
    else{render();vic=await chooseVictim(victims);}
  }
  if(vic!==null){
    const v=G.players[vic],pool=[];RES.forEach(r=>{for(let i=0;i<v.res[r];i++)pool.push(r);});
    stolen=pool[Math.floor(Math.random()*pool.length)];v.res[stolen]--;G.players[p].res[stolen]++;
    ST(p).gainSteal[stolen]++;ST(vic).lostSteal[stolen]++;ST(p).steals++;ST(vic).stolenFrom++;
    log(p===0?`You stole 1${EMO[stolen]} from ${PNAME[vic]}`:vic===0?`${PNAME[p]} stole your 1${EMO[stolen]}`:`${PNAME[p]} stole a card from ${PNAME[vic]}`);
  }
  render();
  if(stolen&&(p===0||vic===0))sfx('steal');
  if(stolen){if(vic===0)popChip(stolen,'−1',true);if(p===0)popChip(stolen,'+1');}
  if(!quick()){
    const hx=H[h],tile=hx.res==='desert'?'🏜️ Desert':`${EMO[hx.res]||'💰'} ${hx.num}`;
    const who=p===0?'You':PNAME[p];
    let html=`<div>🥷 ${who} moved the robber to <b>${tile}</b></div>`;
    if(stolen){
      const show=(p===0||vic===0||S.reveal);
      html+=`<div>${who} stole from ${vic===0?'<b>you</b>':PNAME[vic]}:</div><div class="cardbig">${show?EMO[stolen]:'❓'}</div>`;
    }else html+='<div class="small">Nobody to steal from</div>';
    await evPop(html,(p===0||vic===0)?2800:2000);
  }
}

/* ---------- AI ---------- */
const NOISE={easy:6,normal:1,hard:.25,expert:.05};
const hardish=()=>G.diff==='hard'||G.diff==='expert';
const noise=()=>Math.random()*NOISE[G.diff];
function vScore(v,pid){
  let s=0;const seen=new Set();
  for(const hi of V[v].hexes){const h=H[hi];if(h.fog){s+=3.6;continue;}if(h.res==='desert'||h.res==='sea')continue;s+=pips(h.num)*(h.res==='gold'?1.3:1);seen.add(h.res);}
  s+=seen.size*1.5;if(V[v].port)s+=1.5;
  if(pid!==undefined&&G.players[pid]){
    const sy=G.players[pid].style;
    if(sy==='rusher'){if(seen.has('ore'))s+=1.5;if(seen.has('wheat'))s+=1.5;}
    else if(sy==='builder'){if(seen.has('wood'))s+=1.5;if(seen.has('brick'))s+=1.5;}
    else if(sy==='trader'&&V[v].port)s+=2.5;
  }
  if(hardish()&&pid!==undefined){
    const own=new Set();
    for(const w of V)if(w.owner===pid)for(const hi of w.hexes)if(H[hi].res!=='desert')own.add(H[hi].res);
    for(const r of seen)if(!own.has(r))s+=2.5;
    if(seen.has('wheat')&&seen.has('ore'))s+=1.5;
  }
  if(G.diff==='expert'&&pid!==undefined)for(const hi of V[v].hexes){const n=H[hi].num;if(n===6||n===8)s+=.8;}
  return s;
}
const bestBy=(list,f)=>{let b=null,bs=-1e9;for(const x of list){const s=f(x);if(s>bs){bs=s;b=x;}}return b;};
const distOK=v=>V[v].owner===-1&&V[v].land!==false&&V[v].adj.every(a=>V[a].owner===-1);
function edgeScore(e,pid){
  const ed=E[e];let best=0;
  for(const o of [ed.a,ed.b]){
    if(V[o].owner===pid)continue;
    if(distOK(o))best=Math.max(best,vScore(o,pid));
    for(const w of V[o].adj)if(distOK(w))best=Math.max(best,vScore(w,pid)*0.8);
  }
  return best+noise()*0.5;
}
function bestRoadEdge(p){
  let b=null,bs=-1;
  for(const e of E){if(!roadOK(e.id,p))continue;const s=edgeScore(e.id,p);if(s>bs){bs=s;b=e.id;}}
  return b;
}
const legalSettles=p=>V.filter(x=>settleOK(x.id,p,false));
function aiSettleSetup(p){
  const c=V.filter(v=>settleOK(v.id,p,true));
  const top=G.diff==='expert'?c.slice().sort((a,b)=>vScore(b.id)-vScore(a.id)).slice(0,2).map(v=>v.id):[];   // expert bots take the best spots first
  return bestBy(c,v=>vScore(v.id,p)+noise()+(top.includes(v.id)?2:0)).id;
}
function aiRoadSetup(p,v){
  const opts=V[v].edges.filter(e=>E[e].owner===-1&&edgeKinds(E[e]).includes('road'));
  return bestBy(opts,e=>edgeScore(e,p));
}
function aiRobberHex(p){
  const cand=robberCands(p);
  if(G.diff==='easy'&&Math.random()<.6)return cand[Math.floor(Math.random()*cand.length)];
  return bestBy(cand,i=>{
    const h=H[i];let s=Math.random();
    for(const v of h.verts){
      const o=V[v].owner;if(o===-1)continue;
      const w=pips(h.num)*(V[v].city?2:1);
      if(o===p)s-=w*(G.diff==='expert'?2.5:1.5);
      else s+=w*(G.diff==='expert'?Math.pow(1+totVP(G.players[o])/4,3):G.diff==='hard'?Math.pow(1+totVP(G.players[o])/5,2):(1+totVP(G.players[o])/10));
    }
    return s;
  });
}
function planTrades(pl,p,cost){
  const res={...pl.res},trades=[],bk={...G.bank};
  for(const need of RES){
    while(res[need]<(cost[need]||0)){
      let src=null,best=-1;
      for(const r of RES){
        if(r===need)continue;
        const sur=res[r]-(cost[r]||0),rt=ratio(p,r);
        if(sur>=rt&&sur>best){best=sur;src=r;}
      }
      if(!src||bk[need]<1)return null;
      const rt=ratio(p,src);res[src]-=rt;res[need]++;bk[src]+=rt;bk[need]--;trades.push([src,need,rt]);
    }
  }
  return trades;
}
function aiGoals0(p){
  const pl=G.players[p],sp=legalSettles(p),goals=[];
  const cityOk=pl.cities<4&&pl.settles>0,setOk=pl.settles<5&&sp.length>0,roadOk=pl.roads<15&&bestRoadEdge(p)!==null,devOk=G.deck.length>0;
  if(hardish()&&pl.settles+pl.cities<4){
    if(setOk)goals.push('settle');if(cityOk)goals.push('city');if(!setOk&&roadOk)goals.push('road');if(devOk)goals.push('dev');
  }else{
    if(cityOk)goals.push('city');if(setOk)goals.push('settle');
    if(roadOk&&(!sp.length||pl.settles>=5))goals.push('road');
    if(devOk)goals.push('dev');
  }
  if(G.diff==='easy'){shuffle(goals);if(roadOk&&Math.random()<.3)goals.push('road');}
  if(G.diff!=='easy'&&pl.style==='builder'){
    const rd=roadOk&&pl.roads<Math.min(13,4+2*(pl.settles+pl.cities));
    const o=[];if(setOk)o.push('settle');if(rd)o.push('road');if(cityOk)o.push('city');if(devOk)o.push('dev');
    return o;
  }
  if(G.diff!=='easy'&&pl.style==='rusher'){
    const o=[];if(cityOk)o.push('city');if(devOk)o.push('dev');if(setOk)o.push('settle');if(roadOk&&!setOk)o.push('road');
    return o;
  }
  return goals;
}
function aiGoals(p){
  const g=aiGoals0(p),pl=G.players[p];
  if(G.map==='sea'&&(pl.ships||0)<15&&bestShipEdge(p)!==null){
    if(!legalSettles(p).length)g.unshift('ship');else g.push('ship');
  }
  return g;
}
function shipScore(e,p){
  const ed=E[e],own=new Set();
  V.forEach(v=>{if(v.owner===p&&v.isl>=0)own.add(v.isl);});
  const seen=new Set([ed.a,ed.b]),fr=[[ed.a,0],[ed.b,0]];let best=0;
  while(fr.length){
    const [v,d]=fr.shift();
    if(distOK(v)&&!own.has(V[v].isl))best=Math.max(best,(vScore(v,p)+3)*Math.pow(.75,d));
    if(d<3)for(const w of V[v].adj)if(!seen.has(w)){seen.add(w);fr.push([w,d+1]);}
  }
  return best>0?best+noise()*.5:0;
}
function bestShipEdge(p){let b=null,bs=0.5;for(const e of E){if(!roadOK(e.id,p,'ship'))continue;const sc=shipScore(e.id,p);if(sc>bs){bs=sc;b=e.id;}}return b;}
function aiStep(p){
  const pl=G.players[p];
  if(G.diff==='easy'&&Math.random()<.2)return false;      // easy bots sometimes just stop
  if(XM()==='fish'&&(pl.fish||0)>=2&&aiFish(p))return true;
  const useDev=G.diff!=='easy'||Math.random()<.5;
  if(!G.devPlayed&&useDev){
    if(pl.dev.road>0&&pl.roads<14&&bestRoadEdge(p)!==null){
      pl.dev.road--;G.devPlayed=true;ST(p).devPlayed.road++;log(`${PNAME[p]} played Road Building`);
      for(let i=0;i<2;i++){const e=bestRoadEdge(p);if(e!==null&&pl.roads<15)placeRoad(p,e,true);}
      G.pendPop=[p,'road',devDetail('road')];return true;
    }
    if(pl.dev.plenty>0&&sum(G.bank)>=2){
      pl.dev.plenty--;G.devPlayed=true;ST(p).devPlayed.plenty++;
      const got=[];for(let k=0;k<2;k++){const r=RES.filter(x=>G.bank[x]>0).sort((a,b)=>pl.res[a]-pl.res[b])[0];if(!r)break;pl.res[r]++;G.bank[r]--;ST(p).gainOther[r]++;got.push('1'+EMO[r]);}
      log(`${PNAME[p]} played Bountiful Harvest`);G.pendPop=[p,'plenty',devDetail('plenty',got.join(' '))];return true;
    }
    if(pl.dev.mono>0){
      pl.dev.mono--;G.devPlayed=true;ST(p).devPlayed.mono++;
      const r=RES.slice().sort((a,b)=>pl.res[a]-pl.res[b])[0];
      const n=monopolize(p,r);
      log(`${PNAME[p]} played Market Squeeze on ${EMO[r]} (took ${n})`);G.pendPop=[p,'mono',devDetail('mono',n+EMO[r])];return true;
    }
  }
  const sp=legalSettles(p),goals=aiGoals(p);
  for(const g of goals){
    const cost=COST[g];
    const tr=can(pl,cost)?[]:((G.diff!=='easy'||Math.random()<.5)?planTrades(pl,p,cost):null);
    if(!tr)continue;
    for(const [s,n,rt] of tr){pl.res[s]-=rt;pl.res[n]++;ST(p).lostTrade[s]+=rt;ST(p).gainTrade[n]++;ST(p).bankTrades++;G.bank[s]+=rt;G.bank[n]--;log(`${PNAME[p]} traded ${rt}${EMO[s]} for 1${EMO[n]} with the bank`);}
    if(g==='city'){const v=bestBy(V.filter(x=>x.owner===p&&!x.city),x=>vScore(x.id,p)+noise());placeCity(p,v.id);}
    else if(g==='settle'){const v=bestBy(sp,x=>vScore(x.id,p)+noise());placeSettle(p,v.id,false,false);}
    else if(g==='road'){placeRoad(p,bestRoadEdge(p),false);}
    else if(g==='ship'){const se=bestShipEdge(p);if(se===null)continue;placeShip(p,se,false);}
    else{pay(pl,COST.dev);const c=G.deck.pop();pl.devNew[c]++;ST(p).devBought[c]++;log(`${PNAME[p]} bought a development card`);}
    return true;
  }
  return false;
}
async function aiTurn(p){
  const pl=G.players[p];
  G.phase='roll';render();await sleep(500);
  if(pl.dev.knight>0&&!G.devPlayed&&(H[G.robber].verts.some(v=>V[v].owner===p)||(hardish()&&pl.knights>=2)||(G.diff==='expert'&&G.players.some(q=>q.id!==p&&pubVP(q)>=(G.vpWin||10)-4))||(pl.style==='rusher'&&pl.knights>=1)||(G.barb&&G.barb.pos>=4&&pl.cities>0&&G.diff!=='easy'))){
    pl.dev.knight--;pl.knights++;pl.ak=(pl.ak||0)+1;G.devPlayed=true;ST(p).devPlayed.knight++;log(`${PNAME[p]} played a Knight`);checkArmy(p);
    render();await devPop(p,'knight',devDetail('knight'));
    await robberSequence(p);await flushBonus();checkWin(p);if(G.over)return;
  }
  await rollDice(p);G.phase='main';render();
  await aiMaybeOffer(p);
  for(let g=0;g<25&&!G.over;g++){
    if(!aiStep(p))break;
    render();
    if(G.pendPop){const pp=G.pendPop;G.pendPop=null;await devPop(...pp);}
    await flushBonus();
    checkWin(p);await sleep(650);
  }
}

/* ---------- optional game modes ---------- */
const XMODES={
  classic:{name:'Classic',icon:'⬡',desc:'The base game.'},
  barbarians:{name:'Barbarians',icon:'⛵',desc:'A barbarian fleet sails toward the island. When it lands, all active knights together must match the number of cities, or the weakest defenders lose a city. The best defender earns +1 VP.'},
  fish:{name:'Fishermen',icon:'🐟',desc:'Settlements and cities on the coast catch fish when a neighbouring tile produces. Spend fish to chase the robber away or get resources, roads and development cards.'},
  explore:{name:'Explorers',icon:'🧭',sea:true,desc:'Islands map: the outer islands are hidden in fog. Sail out to discover them; every tile you reveal gives you 1 of its resource.'},
  gold:{name:'Gold fields',icon:'💰',sea:true,desc:'Islands map: gold fields on the outer islands produce any resource you choose.'}
};
const XM=()=>(G&&G.xm)||'classic';
const isCoast=v=>V[v].hexes.length<3||V[v].hexes.some(i=>H[i].res==='sea');
function aiNeed(p){
  const pl=G.players[p],g=aiGoals(p)[0],c=COST[g]||COST.settle;
  return RES.find(r=>(c[r]||0)>pl.res[r]&&G.bank[r]>0)||RES.filter(r=>G.bank[r]>0).sort((a,b)=>pl.res[a]-pl.res[b])[0]||null;
}
function explore(pid,verts){
  if(XM()!=='explore')return;
  for(const v of verts)for(const hi of V[v].hexes){
    const h=H[hi];if(!h.fog)continue;
    h.fog=false;

function rollForOrder(n){
  const rounds=[],roll=()=>1+Math.floor(Math.random()*6);
  const rank=ids=>{
    const rs=ids.map(id=>{const d=[roll(),roll()];return {id,d,t:d[0]+d[1]};});
    rounds.push({rolls:rs.map(r=>({...r}))});
    rs.sort((a,b)=>b.t-a.t);
    const out=[];let i=0;
    while(i<rs.length){
      let j=i;while(j<rs.length&&rs[j].t===rs[i].t)j++;
      const grp=rs.slice(i,j).map(r=>r.id);
      if(grp.length===1)out.push(grp[0]);else out.push(...rank(grp));      // a tie: those players roll again
      i=j;
    }
    return out;
  };
  return {order:rank([...Array(n).keys()]),rounds};
}

// Why is this edge ('e12') or corner ('v5') not allowed in the current placement mode?
function whyNot(mode,key){
  const id=+key.slice(1),pid=0;
  if(key[0]==='e'){
    const ed=E[id];
    if(ed.owner!==-1)return ed.owner===pid?`You already have a road here.`:`${PNAME[ed.owner]} already has a road here.`;
    if(mode==='roadSetup')return `Your starting road must touch the settlement you just placed.`;
    if(mode==='ship'&&!edgeKinds(ed).includes('ship'))return `Ships sail on water: pick an edge that touches the sea.`;
    if(mode==='road'&&!edgeKinds(ed).includes('road'))return `Roads need land: this edge is open sea. Build a ship instead.`;
    for(const v of [ed.a,ed.b]){
      const o=V[v].owner;
      if(o!==-1&&o!==pid&&V[v].edges.some(f=>E[f].owner===pid))return `${PNAME[o]}'s settlement is on this corner. A road can't continue through an opponent's settlement.`;
    }
    return mode==='ship'?`A new ship must start at one of your own settlements, cities or ships.`:`A new road must start at one of your own settlements, cities or roads.`;
  }
  const v=V[id];
  if(mode==='city')return v.owner===pid&&!v.city?'':(v.owner===pid?`This is already a city.`:`Tap one of your own settlements to upgrade it.`);
  if(!v.land)return `Settlements need land: this corner only touches the sea.`;
  if(v.owner!==-1)return `This spot is already built on.`;
  if(mode==='settleSetup'&&G.map==='sea'&&v.isl!==0)return `At the start you may only settle on the main (largest) island. You can reach the other islands by ship later.`;
  if(v.adj.some(a=>V[a].owner!==-1))return `Too close to another settlement: settlements need at least two road lengths between them.`;
  if(mode==='settle')return `A new settlement must connect to one of your roads.`;
  return `You can't build here.`;
}

function expertAccept(q,give,get){
  if(totVP(G.players[0])>=(G.vpWin||10)-3)return false;
  const cost=COST[aiGoals(q.id)[0]]||{};
  const wt=r=>{const have=q.res[r],need=cost[r]||0;return have<need?3:have-need>=2?.5:1;};
  let gain=0;RES.forEach(r=>{gain+=wt(r)*(give[r]-get[r]);});
  return gain>=1.5;
}
function aiAccept(q,give,get){
  const rec=sum(give),gv=sum(get);
  if(G.diff==='easy')return true;
  if(G.diff==='expert')return expertAccept(q,give,get);
  if(rec<gv)return false;
  if(q.style==='trader'&&totVP(G.players[0])<(G.vpWin||10)-3)return true;
  if(totVP(G.players[0])>=(G.vpWin||10)-2)return false;
  if(G.diff==='hard'){
    if(totVP(G.players[0])>=(G.vpWin||10)-3)return false;
    if(rec<=gv)return false;
    return RES.some(r=>give[r]>0&&q.res[r]===0);
  }
  return rec>gv?true:Math.random()<0.6;
}
const fmtRes=o=>RES.filter(r=>o[r]).map(r=>o[r]+EMO[r]).join(' ')||'nothing';
const mkRes=(r,n)=>{const o=emptyRes();o[r]=n;return o;};

const handRow=(give,get)=>`<div class="myhand">${RES.map(r=>{const d=(get[r]||0)-(give[r]||0);return `<span>${EMO[r]}<b>${G.players[0].res[r]}</b><small class="${d>0?'good':'bad'}">${d?(d>0?'+':'−')+Math.abs(d):''}</small></span>`;}).join('')}</div>`;
function applyPlayerTrade(q,give,get){
  const p=G.players[0];
  RES.forEach(r=>{
    p.res[r]+=get[r]-give[r];q.res[r]+=give[r]-get[r];
    ST(0).gainTrade[r]+=get[r];ST(0).lostTrade[r]+=give[r];
    ST(q.id).gainTrade[r]+=give[r];ST(q.id).lostTrade[r]+=get[r];
  });
  ST(0).playerTrades++;ST(q.id).playerTrades++;
  log(`You traded ${fmtRes(give)} for ${fmtRes(get)} with ${PNAME[q.id]}`);
}
// How would bot q answer if the human gives `give` and gets `get`?
function botResponse(q,give,get){
  const me=G.players[0];
  const has=(who,o)=>RES.every(r=>who.res[r]>=o[r]);
  if(!has(q,get))return {type:'decline',why:"doesn't have those cards"};
  if(aiAccept(q,give,get))return {type:'accept',give:{...give},get:{...get}};
  const tries=[];
  for(const r of RES)if(me.res[r]-give[r]>0){const g={...give};g[r]++;tries.push({give:g,get:{...get},score:q.res[r]===0?0:1});}
  if(sum(get)>1)for(const r of RES)if(get[r]>0){const t={...get};t[r]--;tries.push({give:{...give},get:t,score:2});}
  tries.sort((a,b)=>a.score-b.score);
  for(const t of tries)if(has(q,t.get)&&aiAccept(q,t.give,t.get))return {type:'counter',give:t.give,get:t.get};
  return {type:'decline',why:'not interested'};
}

      p.res[g]-=give[g];RES.forEach(r=>p.res[r]+=get[r]);

      ST(0).lostTrade[g]+=give[g];RES.forEach(r=>ST(0).gainTrade[r]+=get[r]);ST(0).bankTrades++;

    });
  };
  draw();
}
// A bot proposes a trade to the human. Resolves when the human has answered.
function offerModal(q,give,get){
  const me=G.players[0];
  return new Promise(done=>{
    const draw=(g0,t0,nt)=>{
      modal(`<h3><span class="dot" style="background:${PCOL[q.id]}"></span>${PNAME[q.id]} offers a trade</h3>
        <div style="text-align:center;margin:10px 0;font-size:18px">You get <b>${fmtRes(t0)}</b><br>You give <b>${fmtRes(g0)}</b></div>
        <div class="sec">Your cards</div>${handRow(g0,t0)}
        <div class="note">${nt||''}</div>
        <div class="row"><button id="oa">Accept</button><button id="oc" class="ghost">Counter</button><button id="od" class="ghost">Decline</button></div>`);
      $('oa').onclick=()=>{
        if(!RES.every(r=>me.res[r]>=g0[r])||!RES.every(r=>q.res[r]>=t0[r])){draw(g0,t0,'That deal is no longer possible.');return;}
        applyPlayerTrade(q,g0,t0);closeModal();render();done('accept');
      };
      $('od').onclick=()=>{log(`You declined ${PNAME[q.id]}'s offer`);closeModal();done('decline');};
      $('oc').onclick=()=>counter(g0,t0);
    };
    const counter=(g0,t0)=>{
      const gv={...g0},gt={...t0};let nt='';
      const d2=()=>{
        modal(`<h3>Counter-offer to ${PNAME[q.id]}</h3>
          <div class="sec">Your cards</div>${handRow(gv,gt)}
          <div class="sec">You give</div><div class="row">${RES.map(r=>stepperRow('give',r,gv[r])).join('')}</div>
          <div class="sec">You get</div><div class="row">${RES.map(r=>stepperRow('get',r,gt[r])).join('')}</div>
          <div class="note">${nt}</div>
          <div class="row"><button id="cp">Propose</button><button id="cb" class="ghost">Back</button></div>`);
        bindSteppers((k,r,d)=>{const o=k==='give'?gv:gt,nv=o[r]+d;if(nv<0||nv>9||(k==='give'&&nv>me.res[r]))return;o[r]=nv;nt='';d2();});
        $('cb').onclick=()=>draw(g0,t0);
        $('cp').onclick=()=>{
          if(!sum(gv)||!sum(gt)){nt='Choose what you give and what you get.';return d2();}
          const rs=botResponse(q,gv,gt);
          if(rs.type==='accept'){applyPlayerTrade(q,gv,gt);closeModal();render();done('accept');}
          else if(rs.type==='counter')draw(rs.give,rs.get,`${PNAME[q.id]} counters with this:`);
          else draw(g0,t0,`${PNAME[q.id]}: ${rs.why}. The first offer still stands.`);
        };
      };
      d2();
    };
    draw(give,get);
  });
}
// Before building, a bot that is exactly one card short may offer the human a swap.
async function aiMaybeOffer(p){
  if(G.auto||!S.offers||G.over)return;
  const pl=G.players[p],me=G.players[0];
  if(cards(me)===0)return;
  if(Math.random()>(G.diff==='easy'?0.25:pl.style==='trader'?0.75:0.45))return;
  if(hardish()&&totVP(me)>=(G.vpWin||10)-3)return;
  for(const g of aiGoals(p)){
    const cost=COST[g];
    if(can(pl,cost))return;
    const lack=RES.filter(r=>pl.res[r]<(cost[r]||0));
    const missing=lack.reduce((a,r)=>a+(cost[r]-pl.res[r]),0);
    if(missing!==1)continue;
    const want=lack[0];
    if(me.res[want]<1)continue;
    const spareOf=r=>pl.res[r]-(cost[r]||0);
    const spare=RES.filter(r=>r!==want&&spareOf(r)>=1).sort((a,b)=>spareOf(b)-spareOf(a))[0];
    if(!spare)continue;
    const k=G.diff==='easy'?Math.min(2,spareOf(spare)):1;
    render();
    await offerModal(pl,mkRes(want,1),mkRes(spare,k));
    return;
  }
}

      <div class="small"><span style="color:#4fc3f7">■</span> rolled &nbsp;<span style="color:#ef5350">■</span> sevens (robber) &nbsp;<span style="color:#ffd54f">▬</span> expected with fair dice</div>
      <p class="small">Average roll <b>${f1(avg)}</b> (expected 7.0) · Sevens <b>${sevens}</b> (expected ${f1(tot/6)}) · Most common: <b>${cs}</b> (${common}×)</p>
      ${table(
        row('Sevens rolled by player',i=>ST(i).rolled7)+
        row('Dice production expected',i=>f1(ST(i).expected))+
        row('Dice production received',i=>sum(ST(i).gainDice))+
        row('Dice luck',i=>{const d=sum(ST(i).gainDice)-ST(i).expected;return `<span class="${d>=0?'good':'bad'}">${d>=0?'+':''}${f1(d)}</span>`;})+
        row('Blocked by the robber',i=>sum(ST(i).blocked))+
        row('Short-changed by an empty bank',i=>ST(i).short)
      )}
      <div class="small">Expected production is computed from each roll using your buildings at that time (cities count double).</div>`;
  }else if(tab==='cards'){
    body=legend+stacked('Cards received from dice','gainDice')+stacked('Cards spent on building and dev cards','spent')+stacked('Cards lost (robber, discards, Market Squeeze, trades)','_lost')+
      table(
        head('Gains')+
        row('From dice',i=>sum(ST(i).gainDice))+
        row('Stolen with the robber',i=>sum(ST(i).gainSteal))+
        row('Trades (bank and players)',i=>sum(ST(i).gainTrade))+
        row('Start, Bountiful Harvest, Market Squeeze',i=>sum(ST(i).gainOther))+
        head('Spending and losses')+
        row('Spent on building / dev cards',i=>sum(ST(i).spent))+
        row('Given away in trades',i=>sum(ST(i).lostTrade))+
        row('Stolen from you',i=>sum(ST(i).lostSteal))+
        row('Discarded after a 7',i=>sum(ST(i).lostDiscard))+
        row('Lost to Market Squeeze',i=>sum(ST(i).lostMono))+
        head('Other')+
        row('Bank trades',i=>ST(i).bankTrades)+
        row('Player trades',i=>ST(i).playerTrades)+
        row('Largest hand (at end of turns)',i=>ST(i).peak)
      );
  }else{
    const D=['knight','vp','road','plenty','mono'];
    body=table(
      head('Built (including starting pieces)')+
      row('Roads',i=>ST(i).built.road)+row('Settlements',i=>ST(i).built.settle)+row('Cities',i=>ST(i).built.city)+
      head('Development cards bought')+
      row('Total',i=>sum(ST(i).devBought))+
      D.map(t=>row(DEVICON[t]+' '+DEVNAME[t],i=>ST(i).devBought[t],'sub')).join('')+
      head('Development cards played')+
      row('Total',i=>sum(ST(i).devPlayed))+
      D.filter(t=>t!=='vp').map(t=>row(DEVICON[t]+' '+DEVNAME[t],i=>ST(i).devPlayed[t],'sub')).join('')+
      head('Robber')+
      row('Times moved',i=>ST(i).robberMoves)+row('Cards stolen',i=>ST(i).steals)+row('Times robbed',i=>ST(i).stolenFrom)
    );
  }
  modal(`<div class="hdr"><h3>📊 Game statistics</h3></div>
    <div class="seg">${[['overview','Overview'],['dice','🎲 Dice'],['cards','Cards'],['actions','Actions']].map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>
    ${body}
    <div class="row"><button id="sclose" class="ghost">${end?'Back':'Close'}</button></div>`);
  $('mbox').style.maxWidth='680px';
  $('mbox').querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>statsModal(b.dataset.tab,end));
  $('sclose').onclick=()=>end?showWin():closeModal();
}

const MAPDESC={sea:'Islands: several islands in open sea. Start on the main island, then build ships 🌲🐑 to reach the others; the first settlement on each new island gives +1 VP.',std:'Standard: a random 19-tile island for 2–4 players.',fixed:'Beginner: the same balanced 19-tile island every game. Good for learning.',large:'Large: 30 tiles and 11 ports for 4–6 players. The bank holds 24 of each card and there are 34 development cards.'};
const mapSeg=(cur,dis)=>seg('map',[['std','Standard'],['fixed','Beginner'],['sea','Islands'],['large','Large']],cur,dis);
const botsSeg=(cur,dis)=>seg('bots',S.map==='large'?[[3,'3 bots'],[4,'4 bots'],[5,'5 bots']]:[[1,'1 bot'],[2,'2 bots'],[3,'3 bots']],cur,dis);
const mapFix=pm=>{if(S.map==='large'&&pm!=='large')S.bots=Math.max(S.bots,4);if(S.map!=='large'&&S.bots>3)S.bots=3;if(S.map==='large'&&S.bots<3)S.bots=3;saveS();};
function seg(key,opts,cur,dis){return `<div class="seg">${opts.map(([v,l])=>`<button data-seg="${key}" data-val="${v}" class="${String(cur)===String(v)?'on':''}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`;}
function bindSeg(rerender){
  $('mbox').querySelectorAll('button[data-seg]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.seg,v=b.dataset.val;S[k]=isNaN(+v)?v:+v;saveS();rerender();
  });
}
function startModal(){
  const sv=readSave();
  let resume='';
  if(sv){
    const g=sv.G,p0=g.players[0],vp=p0.settles+2*p0.cities+(g.lr===0?2:0)+(g.la===0?2:0)+p0.dev.vp+p0.devNew.vp;
    const mins=Math.max(0,Math.round((Date.now()-sv.t)/60000));
    const ago=mins<1?'just now':mins<60?mins+' min ago':Math.round(mins/60)+' h ago';
    resume=`<div class="row"><button id="resume">▶ Continue saved game</button></div>
      <div class="small" style="text-align:center">${g.n-1} bot${g.n>2?'s':''} · ${g.diff} · you have ${vp} VP · saved ${ago} · <a id="delsave" style="text-decoration:underline;cursor:pointer">delete</a></div><hr style="opacity:.25">`;
  }
  modal(`<h3>⬡ Hexfarers <small style="font-weight:400;opacity:.7">v${VERSION} · build ${BUILD}</small></h3>${resume}<div class="small">Settle the island: collect resources, trade, build roads, settlements and cities. First to ${S.rules.vp} victory points wins. Plays fully offline and saves automatically.</div>
    <div class="sec">Your colour</div><div class="seg" id="cols">${palette().map(([n,c],i)=>`<button data-col="${i}" title="${n}" aria-label="${n}" style="background:${c};border:3px solid ${S.color===i?'#fff':'transparent'};padding:14px 0;${S.color===i?'box-shadow:0 0 0 2px #2e9e5b':''}"></button>`).join('')}</div>
    <div class="sec">Game mode</div>${xmGrid()}
    <div class="small">${XMODES[S.xmode||'classic'].desc}${XMODES[S.xmode||'classic'].sea?' <b>Uses the Islands map.</b>':''}</div>
    <div class="sec">Map</div>${mapSeg(XMODES[S.xmode||'classic'].sea?'sea':S.map,!!XMODES[S.xmode||'classic'].sea)}
    <div class="small">${MAPDESC[XMODES[S.xmode||'classic'].sea?'sea':S.map]||''}</div>
    <div class="sec">Opponents</div>${botsSeg(S.bots)}
    <div class="sec">Bot difficulty</div>${seg('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard'],['expert','Expert']],S.diff)}
    <div class="small">${DIFFDESC[S.diff]}</div>
    <div class="row"><button id="go">${sv?'Start a new game':'Start game'}</button></div>
    <div class="row"><button id="tback" class="ghost">← Title screen</button></div>
    <div class="row"><button id="daily" class="ghost">📅 Daily challenge</button><button id="rules" class="ghost">⚖️ Game rules${rulesLabel()}</button></div>
    <div class="row"><button id="st" class="ghost">⚙ Settings</button><button id="car" class="ghost">🏅 Career</button><button id="rbk" class="ghost">📖 Rulebook</button></div>
    ${showInstall()?'<div class="row"><button id="inst" class="ghost">📲 Install on my phone</button></div>':''}
    <div class="small" style="text-align:center;opacity:.65;margin-top:6px">Independent fan project, not affiliated with CATAN GmbH. GPL-3.0. <a id="about" style="text-decoration:underline;cursor:pointer">About</a></div>`);
  {const pm=S.map;bindSeg(()=>{mapFix(pm);startModal();});}
  $('mbox').querySelectorAll('button[data-col]').forEach(b=>b.onclick=()=>{S.color=+b.dataset.col;saveS();startModal();});
  if(sv){
    $('resume').onclick=()=>{if(!loadGame())startModal();};
    $('delsave').onclick=()=>{clearSave();startModal();};
  }
  $('go').onclick=()=>newGame(S.bots,false,S.diff);
  $('tback').onclick=()=>titleScreen();
  $('st').onclick=()=>settingsModal(false);
  $('car').onclick=()=>careerModal(startModal);
  $('daily').onclick=()=>dailyModal(startModal);
  if($('inst'))$('inst').onclick=()=>installModal(startModal);
  $('rules').onclick=()=>rulesModal(startModal);
  $('rbk').onclick=()=>rulebookModal(startModal,S.xmode);
  $('about').onclick=()=>rulebookModal(startModal,'about');

let STAB='game';

ust match the number of cities, or the weakest defenders lose a city. The best defender earns +1 VP.":["Eine Barbarenflotte segelt auf die Insel zu. Landet sie, müssen alle aktiven Ritter zusammen mindestens so viele sein wie Städte, sonst verlieren die schwächsten Verteidiger eine Stadt. Der beste Verteidiger erhält +1 SP.","Une flotte barbare s'approche de l'île. À son arrivée, l'ensemble des chevaliers actifs doit égaler le nombre de villes, sinon les plus faibles défenseurs perdent une ville. Le meilleur défenseur gagne +1 PV.","Una flotta barbara naviga verso l'isola. Quando sbarca, i cavalieri attivi di tutti devono eguagliare il numero di città, altrimenti i difensori più deboli perdono una città. Il miglior difensore ottiene +1 PV.","Flota barbarzyńców płynie ku wyspie. Gdy wyląduje, wszyscy aktywni rycerze razem muszą dorównać liczbie miast, inaczej najsłabsi obrońcy tracą miasto. Najlepszy obrońca zdobywa +1 PZ."],"Settlements and cities on the coast catch fish when a neighbouring tile produces. Spend fish to chase the robber away or get resources, roads and development cards.":["Siedlungen und Städte an der Küste fangen Fische, wenn ein Nachbarfeld Ertrag bringt. Gib Fische aus, um den Räuber zu vertreiben oder Rohstoffe, Straßen und Entwicklungskarten zu bekommen.","Les colonies et villes côtières pêchent des poissons quand une tuile voisine produit. Dépensez-les pour chasser le voleur ou obtenir ressources, routes et cartes développement.","Insediamenti e città sulla costa pescano pesci quando una tessera vicina produce. Spendili per cacciare il brigante o ottenere risorse, strade e carte sviluppo.","Osady i miasta na wybrzeżu łowią ryby, gdy sąsiednie pole daje plony. Wydawaj ryby, by przegonić złodzieja albo zdobyć surowce, drogi i karty rozwoju."],"Islands map: the outer islands are hidden in fog. Sail out to discover them; every tile you reveal gives you 1 of its resource.":["Inselkarte: Die äußeren Inseln liegen im Nebel. Segle hinaus, um sie zu entdecken; jedes aufgedeckte Feld bringt dir 1 seines Rohstoffs.","Carte Îles : les îles extérieures sont cachées dans le brouillard. Naviguez pour les découvrir ; chaque tuile révélée vous donne 1 de sa ressource.","Mappa Isole: le isole esterne sono nascoste nella nebbia. Salpa per scoprirle; ogni tessera rivelata ti dà 1 della sua risorsa.","Mapa Wyspy: zewnętrzne wyspy kryje mgła. Wypłyń, by je odkryć; każde odkryte pole daje ci 1 swojego surowca."],"Islands map: gold fields on the outer islands produce any resource you choose.":["Inselkarte: Goldfelder auf den äußeren Inseln liefern einen Rohstoff deiner Wahl.","Carte Îles : les champs d'or des îles extérieures produisent la ressource de votre choix.","Mappa Isole: i campi d'oro sulle isole esterne producono la risorsa che preferisci.","Mapa Wyspy: złote pola na zewnętrznych wyspach dają dowolny wybrany surowiec."],"Standard":["Standard","Standard","Standard","Standardowa"],"Beginner":["Einsteiger","Débutant","Principiante","Dla początkujących"],"Islands":["Inseln","Îles","Isole","Wyspy"],"Large":["Groß","Grande","Grande","Duża"],"Standard: a random 19-tile island for 2–4 players.":["Standard: eine zufällige Insel mit 19 Feldern für 2–4 Spieler.","Standard : une île aléatoire de 19 tuiles pour 2 à 4 joueurs.","Standard: un'isola casuale di 19 tessere per 2–4 giocatori.","Standardowa: losowa wyspa z 19 pól dla 2–4 graczy."],"Beginner: the same balanced 19-tile island every game. Good for learning.":["Einsteiger: jedes Mal dieselbe ausgewogene Insel mit 19 Feldern. Gut zum Lernen.","Débutant : la même île équilibrée de 19 tuiles à chaque partie. Idéale pour apprendre.","Principiante: la stessa isola equilibrata di 19 tessere ogni partita. Ideale per imparare.","Dla początkujących: zawsze ta sama zrównoważona wyspa z 19 pól. Dobra do nauki."],"Islands: several islands in open sea. Start on the main island, then build ships 🌲🐑 to reach the others; the first settlement on each new island gives +1 VP.":["Inseln: mehrere Inseln im offenen Meer. Beginne auf der Hauptinsel und baue Schiffe 🌲🐑, um die anderen zu erreichen; die erste Siedlung auf jeder neuen Insel bringt +1 SP.","Îles : plusieurs îles en pleine mer. Commencez sur l'île principale, puis construisez des bateaux 🌲🐑 pour atteindre les autres ; la première colonie sur chaque nouvelle île rapporte +1 PV.","Isole: varie isole in mare aperto. Inizia sull'isola principale, poi costruisci navi 🌲🐑 per raggiungere le altre; il primo insediamento su ogni nuova isola vale +1 PV.","Wyspy: kilka wysp na otwartym morzu. Zacznij na wyspie głównej, potem buduj statki 🌲🐑, by dotrzeć do pozostałych; pierwsza osada na każdej nowej wyspie daje +1 PZ."],"Large: 30 tiles and 11 ports for 4–6 players. The bank holds 24 of each card and there are 34 development cards.":["Groß: 30 Felder und 11 Häfen für 4–6 Spieler. Die Bank hat 24 Karten jeder Sorte und es gibt 34 Entwicklungskarten.","Grande : 30 tuiles et 11 ports pour 4 à 6 joueurs. La banque a 24 cartes de chaque sorte et il y a 34 cartes développement.","Grande: 30 tessere e 11 porti per 4–6 giocatori. La banca ha 24 carte di ogni tipo e ci sono 34 carte sviluppo.","Duża: 30 pól i 11 portów dla 4–6 graczy. Bank ma po 24 karty każdego rodzaju, a kart rozwoju jest 34."],"1 bot":["1 Bot","1 bot","1 bot","1 bot"],"2 bots":["2 Bots","2 bots","2 bot","2 boty"],"3 bots":["3 Bots","3 bots","3 bot","3 boty"],"4 bots":["4 Bots","4 bots","4 bot","4 boty"],"5 bots":["5 Bots","5 bots","5 bot","5 botów"],"Easy":["Leicht","Facile","Facile","Łatwy"],"Normal":["Normal","Normal","Normale","Normalny"],"Hard":["Schwer","Difficile","Difficile","Trudny"],"Expert":["Experte","Expert","Esperto","Ekspert"],"Easy: bots build haphazardly, skip some actions and accept almost any trade.":["Leicht: Bots bauen planlos, lassen Aktionen aus und nehmen fast jeden Handel an.","Facile : les bots construisent au hasard, sautent des actions et acceptent presque tout échange.","Facile: i bot costruiscono a caso, saltano alcune azioni e accettano quasi ogni scambio.","Łatwy: boty budują chaotycznie, pomijają ruchy i przyjmują prawie każdą wymianę."],"Normal: balanced bots that plan builds and use the bank.":["Normal: ausgewogene Bots, die ihren Ausbau planen und die Bank nutzen.","Normal : des bots équilibrés qui planifient et utilisent la banque.","Normale: bot equilibrati che pianificano le costruzioni e usano la banca.","Normalny: zrównoważone boty, które planują budowę i korzystają z banku."],"Hard: bots pick complementary spots, race for cities, target the leader with the robber and drive hard bargains.":["Schwer: Bots wählen sich ergänzende Plätze, eilen zu Städten, schicken den Räuber zum Führenden und handeln hart.","Difficile : les bots choisissent des emplacements complémentaires, foncent vers les villes, visent le meneur avec le voleur et négocient dur.","Difficile: i bot scelgono posizioni complementari, puntano alle città, colpiscono il leader col brigante e trattano duro.","Trudny: boty wybierają uzupełniające się miejsca, pędzą do miast, nasyłają złodzieja na lidera i twardo negocjują."],"Expert: like Hard, but bots also grab the best spots first, favour 6s and 8s, hit the leader hard, and only trade when it clearly helps them.":["Experte: wie Schwer, aber Bots schnappen sich zuerst die besten Plätze, bevorzugen 6 und 8, setzen dem Führenden hart zu und handeln nur mit klarem Vorteil.","Expert : comme Difficile, mais les bots prennent d'abord les meilleurs emplacements, privilégient les 6 et 8, frappent fort le meneur et n'échangent que si cela les aide nettement.","Esperto: come Difficile, ma i bot prendono subito i posti migliori, preferiscono 6 e 8, colpiscono duro il leader e scambiano solo se conviene chiaramente.","Ekspert: jak Trudny, ale boty najpierw zajmują najlepsze miejsca, wolą 6 i 8, mocno atakują lidera i handlują tylko z wyraźną korzyścią."],"Red":["Rot","Rouge","Rosso","Czerwony"],"Blue":["Blau","Bleu","Blu","Niebieski"],"Orange":["Orange","Orange","Arancio art doit toucher la colonie que tu viens de placer.","La strada iniziale deve toccare l'insediamento appena piazzato.","Początkowa droga musi dotykać właśnie postawionej osady."],"Ships sail on water: pick an edge that touches the sea.":["Schiffe fahren auf dem Wasser: wähle eine Kante am Meer.","Les bateaux naviguent sur l'eau : choisis un côté qui touche la mer.","Le navi vanno sull'acqua: scegli un lato che tocca il mare.","Statki pływają po wodzie: wybierz krawędź przy morzu."],"Roads need land: this edge is open sea. Build a ship instead.":["Straßen brauchen Land: Diese Kante ist offenes Meer. Baue stattdessen ein Schiff.","Les routes ont besoin de terre : ce côté est en pleine mer. Construis un bateau.","Le strade richiedono terra: questo lato è mare aperto. Costruisci una nave.","Drogi wymagają lądu: ta krawędź to otwarte morze. Zbuduj statek."],"A new ship must start at one of your own settlements, cities or ships.":["Ein neues Schiff muss an deiner Siedlung, Stadt oder deinem Schiff beginnen.","Un nouveau bateau doit partir d'une de tes colonies, villes ou bateaux.","Una nuova nave deve partire da un tuo insediamento, città o nave.","Nowy statek musi zaczynać się przy twojej osadzie, mieście lub statku."],"A new road must start at one of your own settlements, cities or roads.":["Eine neue Straße muss an deiner Siedlung, Stadt oder Straße beginnen.","Une nouvelle route doit partir d'une de tes colonies, villes ou routes.","Una nuova strada deve partire da un tuo insediamento, città o strada.","Nowa droga musi zaczynać się przy twojej osadzie, mieście lub drodze."],"This is already a city.":["Das ist schon eine Stadt.","C'est déjà une ville.","È già una città.","To już jest miasto."],"Tap one of your own settlements to upgrade it.":["Tippe auf eine deiner Siedlungen, um sie auszubauen.","Touche une de tes colonies pour l'améliorer.","Tocca uno dei tuoi insediamenti per migliorarlo.","Dotknij jednej ze swoich osad, by ją rozbudować."],"Settlements need land: this corner only touches the sea.":["Siedlungen brauchen Land: Diese Ecke grenzt nur ans Meer.","Les colonies ont besoin de terre : ce coin ne touche que la mer.","Gli insediamenti richiedono terra: questo angolo tocca solo il mare.","Osady wymagają lądu: ten narożnik dotyka tylko morza."],"This spot is already built on.":["Hier steht schon etwas.","Cet emplacement est déjà occupé.","Questo punto è già occupato.","To miejsce jest już zabudowane."],"At the start you may only settle on the main (largest) island. You can reach the other islands by ship later.":["Zu Beginn darfst du nur auf der Hauptinsel (der größten) siedeln. Die anderen Inseln erreichst du später per Schiff.","Au début, tu ne peux t'installer que sur l'île principale (la plus grande). Tu atteindras les autres en bateau.","All'inizio puoi insediarti solo sull'isola principale (la più grande). Le altre le raggiungerai in nave.","Na początku możesz osiedlać się tylko na wyspie głównej (największej). Inne wyspy osiągniesz później statkiem."],"Too close to another settlement: settlements need at least two road lengths between them.":["Zu nah an einer anderen Siedlung: Zwischen Siedlungen müssen mindestens zwei Straßenlängen liegen.","Trop près d'une autre colonie : il faut au moins deux longueurs de route entre elles.","Troppo vicino a un altro insediamento: servono almeno due lunghezze di strada tra loro.","Za blisko innej osady: między osadami muszą być co najmniej dwie długości drogi."],"A new settlement must connect to one of your roads.":["Eine neue Siedlung muss an eine deiner Straßen anschließen.","Une nouvelle colonie doit être reliée à une de tes routes.","Un nuovo insediamento deve collegarsi a una tua strada.","Nowa osada musi łączyć się z twoją drogą."],"You can't build here.":["Hier kannst du nicht bauen.","Tu ne peux pas construire ici.","Non puoi costruire qui.","Nie możesz tu budować."],"End your turn?":["Zug beenden?","Finir ton tour ?","Finire il turno?","Zakończyć turę?"],"You can still
