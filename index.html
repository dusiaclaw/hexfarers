    let o=`<svg viewBox="0 0 ${W} ${Hh}" width="100%">`;
    for(let v=0;v<=yMax;v+=2)o+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#fff" stroke-opacity=".12"/><text x="${l-4}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9cc">${v}</text>`;
    o+=`<line x1="${l}" x2="${W-r}" y1="${Y(WV)}" y2="${Y(WV)}" stroke="#ffd54f" stroke-dasharray="4 3" stroke-opacity=".8"/>`;
    P.forEach(p=>{o+=`<polyline fill="none" stroke="${PCOL[p.id]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${st.vp.map((v,i)=>X(i).toFixed(1)+','+Y(v[p.id]).toFixed(1)).join(' ')}"/>`;});
    return o+`<text x="${W/2}" y="${Hh-5}" text-anchor="middle" font-size="9" fill="#9cc">turns played →</text></svg>`;
  }

  let body='';
  if(tab==='overview'){
    const mins=Math.max(1,Math.round((Date.now()-st.start)/60000));
    body=`<p class="small">${G.winner!==null?`Winner: <b style="color:${PCOL[G.winner]}">${PNAME[G.winner]}</b> · `:''}${tot} dice rolls (about ${Math.ceil(tot/G.n)} rounds) · ${mins} min</p>
      <div class="sec">Victory points over time</div>${vpChart()}
      ${table(
        row('Victory points',i=>`<b>${totVP(P[i])}</b>`)+
        row('Settlements / cities',i=>`${P[i].settles} / ${P[i].cities}`)+
        row('Longest road reached',i=>ST(i).maxRoad)+
        row('Knights played',i=>P[i].knights)+
        row('Special cards',i=>(G.lr===i?'🛣️ ':'')+(G.la===i?'⚔️':'')||'–')+
        row('Turns taken',i=>ST(i).turns)
      )}`;
  }else if(tab==='dice'){
    let sevens=st.rolls[7],avg=tot?(st.rolls.reduce((a,c,s)=>a+c*s,0)/tot):0;
    let common=0,cs=7;for(let s=2;s<=12;s++)if(st.rolls[s]>common){common=st.rolls[s];cs=s;}
    body=`<div class="sec">Rolls of the dice (${tot} total)</div>${diceChart()}
      <div class="small"><span style="color:#4fc3f7">■</span> rolled &nbsp;<span style="color:#ef5350">■</span> sevens (robber) &nbsp;<span style="color:#ffd54f">▬</span> expected with fair dice</div>
      <p class="small">Average roll <b>${f1(avg)}</b> (expected 7.0) · Sevens <b>${sevens}</b> (expected ${f1(tot/6)}) · Most common: <b>${cs}</b> (${common}×)</p>
      ${table(
        row('Sevens rolled by player',i=>ST(i).rolled7)+
        row('Dice production expected',i=>f1(ST(i).expected))+
        row('Dice production received',i=>sum(ST(i).gainDice))+
        row('Dice luck',i=>{const d=sum(ST(i).gainDice)-ST(i).expected;return `<span class="${d>=0?'good':'bad'}">${d>=0?'+':''}${f1(d)}</span>`;})+
        row('Blocked by the robber',i=>sum(ST(i).blocked))+
        row('Short-changed by an empty bank',i=>ST(i).short)
      )}
      <div class="small">Expected production is computed from each roll using your buildings at that time (cities count double).</div>`;
  }else if(tab==='cards'){
    body=legend+stacked('Cards received from dice','gainDice')+stacked('Cards spent on building and dev cards','spent')+stacked('Cards lost (robber, discards, Monopoly, trades)','_lost')+
      table(
        head('Gains')+
        row('From dice',i=>sum(ST(i).gainDice))+
        row('Stolen with the robber',i=>sum(ST(i).gainSteal))+
        row('Trades (bank and players)',i=>sum(ST(i).gainTrade))+
        row('Start, Year of Plenty, Monopoly',i=>sum(ST(i).gainOther))+
        head('Spending and losses')+
        row('Spent on building / dev cards',i=>sum(ST(i).spent))+
        row('Given away in trades',i=>sum(ST(i).lostTrade))+
        row('Stolen from you',i=>sum(ST(i).lostSteal))+
        row('Discarded after a 7',i=>sum(ST(i).lostDiscard))+
        row('Lost to Monopoly',i=>sum(ST(i).lostMono))+
        head('Other')+
        row('Bank trades',i=>ST(i).bankTrades)+
        row('Player trades',i=>ST(i).playerTrades)+
        row('Largest hand (at end of turns)',i=>ST(i).peak)
      );
  }else{
    const D=['knight','vp','road','plenty','mono'];
    body=table(
      head('Built (including starting pieces)')+
      row('Roads',i=>ST(i).built.road)+row('Settlements',i=>ST(i).built.settle)+row('Cities',i=>ST(i).built.city)+
      head('Development cards bought')+
      row('Total',i=>sum(ST(i).devBought))+
      D.map(t=>row(DEVICON[t]+' '+DEVNAME[t],i=>ST(i).devBought[t],'sub')).join('')+
      head('Development cards played')+
      row('Total',i=>sum(ST(i).devPlayed))+
      D.filter(t=>t!=='vp').map(t=>row(DEVICON[t]+' '+DEVNAME[t],i=>ST(i).devPlayed[t],'sub')).join('')+
      head('Robber')+
      row('Times moved',i=>ST(i).robberMoves)+row('Cards stolen',i=>ST(i).steals)+row('Times robbed',i=>ST(i).stolenFrom)
    );
  }
  modal(`<div class="hdr"><h3>📊 Game statistics</h3></div>
    <div class="seg">${[['overview','Overview'],['dice','🎲 Dice'],['cards','Cards'],['actions','Actions']].map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>
    ${body}
    <div class="row"><button id="sclose" class="ghost">${end?'Back':'Close'}</button></div>`);
  $('mbox').style.maxWidth='680px';
  $('mbox').querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>statsModal(b.dataset.tab,end));
  $('sclose').onclick=()=>end?showWin():closeModal();
}

/* ---------- start screen & settings ---------- */
const MAPDESC={sea:'Islands: several islands in open sea. Build ships 🌲🐑 to reach new islands; the first settlement on each new island gives +1 VP.',std:'Standard: a random 19-tile island for 2–4 players.',fixed:'Beginner: the same balanced 19-tile island every game. Good for learning.',large:'Large: 30 tiles and 11 ports for 4–6 players. The bank holds 24 of each card and there are 34 development cards.'};
const mapSeg=(cur,dis)=>seg('map',[['std','Standard'],['fixed','Beginner'],['sea','Islands'],['large','Large']],cur,dis);
const botsSeg=(cur,dis)=>seg('bots',S.map==='large'?[[3,'3 bots'],[4,'4 bots'],[5,'5 bots']]:[[1,'1 bot'],[2,'2 bots'],[3,'3 bots']],cur,dis);
const mapFix=pm=>{if(S.map==='large'&&pm!=='large')S.bots=Math.max(S.bots,4);if(S.map!=='large'&&S.bots>3)S.bots=3;if(S.map==='large'&&S.bots<3)S.bots=3;saveS();};
function seg(key,opts,cur,dis){return `<div class="seg">${opts.map(([v,l])=>`<button data-seg="${key}" data-val="${v}" class="${String(cur)===String(v)?'on':''}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`;}
function bindSeg(rerender){
  $('mbox').querySelectorAll('button[data-seg]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.seg,v=b.dataset.val;S[k]=isNaN(+v)?v:+v;saveS();rerender();
  });
}
function startModal(){
  const sv=readSave();
  let resume='';
  if(sv){
    const g=sv.G,p0=g.players[0],vp=p0.settles+2*p0.cities+(g.lr===0?2:0)+(g.la===0?2:0)+p0.dev.vp+p0.devNew.vp;
    const mins=Math.max(0,Math.round((Date.now()-sv.t)/60000));
    const ago=mins<1?'just now':mins<60?mins+' min ago':Math.round(mins/60)+' h ago';
    resume=`<div class="row"><button id="resume">▶ Continue saved game</button></div>
      <div class="small" style="text-align:center">${g.n-1} bot${g.n>2?'s':''} · ${g.diff} · you have ${vp} VP · saved ${ago} · <a id="delsave" style="text-decoration:underline;cursor:pointer">delete</a></div><hr style="opacity:.25">`;
  }
  modal(`<h3>⬡ Hexfarers <small style="font-weight:400;opacity:.7">v${VERSION} · build ${BUILD}</small></h3>${resume}<div class="small">Settle the island: collect resources, trade, build roads, settlements and cities. First to ${S.rules.vp} victory points wins. Plays fully offline and saves automatically.</div>
    <div class="sec">Your colour</div><div class="seg" id="cols">${palette().map(([n,c],i)=>`<button data-col="${i}" title="${n}" aria-label="${n}" style="background:${c};border:3px solid ${S.color===i?'#fff':'transparent'};padding:14px 0;${S.color===i?'box-shadow:0 0 0 2px #2e9e5b':''}"></button>`).join('')}</div>
    <div class="sec">Map</div>${mapSeg(S.map)}
    <div class="small">${MAPDESC[S.map]||''}</div>
    <div class="sec">Opponents</div>${botsSeg(S.bots)}
    <div class="sec">Bot difficulty</div>${seg('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard'],['expert','Expert']],S.diff)}
    <div class="small">${DIFFDESC[S.diff]}</div>
    <div class="row"><button id="go">${sv?'Start a new game':'Start game'}</button></div>
    <div class="row"><button id="daily" class="ghost">📅 Daily challenge</button><button id="rules" class="ghost">⚖️ Game rules${rulesLabel()}</button></div>
    <div class="row"><button id="st" class="ghost">⚙ Settings</button><button id="car" class="ghost">🏅 Career</button></div>
    ${isStandalone()?'':'<div class="row"><button id="inst" class="ghost">📲 Install on my phone</button></div>'}`);
  {const pm=S.map;bindSeg(()=>{mapFix(pm);startModal();});}
  $('mbox').querySelectorAll('button[data-col]').forEach(b=>b.onclick=()=>{S.color=+b.dataset.col;saveS();startModal();});
  if(sv){
    $('resume').onclick=()=>{if(!loadGame())startModal();};
    $('delsave').onclick=()=>{clearSave();startModal();};
  }
  $('go').onclick=()=>newGame(S.bots,false,S.diff);
  $('st').onclick=()=>settingsModal(false);
  $('car').onclick=()=>careerModal(startModal);
  $('daily').onclick=()=>dailyModal(startModal);
  if($('inst'))$('inst').onclick=()=>installModal(startModal);
  $('rules').onclick=()=>rulesModal(startModal);
}
function settingsModal(inGame){
  const tog=(k,l)=>`<label class="tog"><input type="checkbox" data-t="${k}" ${S[k]?'checked':''}>${l}</label>`;
  modal(`<div class="hdr"><h3>⚙ Settings</h3><span class="small">Hexfarers v${VERSION} · build ${BUILD}</span></div>
    <div class="sec">Map ${inGame?'<span class="small">(applies to next game)</span>':''}</div>${mapSeg(S.map,inGame)}
    <div class="sec">Opponents ${inGame?'<span class="small">(applies to next game)</span>':''}</div>${botsSeg(S.bots,inGame)}
    <div class="sec">Bot difficulty ${inGame?`<span class="small">(this game: ${G.diff}; change applies next game)</span>`:''}</div>${seg('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard'],['expert','Expert']],S.diff,inGame)}
    <div class="small">${DIFFDESC[S.diff]}</div>
    <div class="sec">Bot action delay: <b id="v1"></b></div><input type="range" id="r1" min=".5" max="3" step=".25" value="${S.delay}">
    <div class="sec">Pause at the start of each bot turn: <b id="v2"></b></div><input type="range" id="r2" min="0" max="4" step=".5" value="${S.turnPause}">
    ${tog('step','Wait for my tap after each bot turn')}
    ${tog('anim','Animations (dice roll, flying cards)')}
    ${tog('hl','Highlight tiles matching the dice roll')}
    ${tog('reveal','Reveal cards stolen between bots')}
    ${tog('confirmEnd','Ask before ending my turn if I can still build')}
    ${tog('confirmPick','Confirm setup and robber placements')}
    ${tog('offers','Bots may propose trades to me')}
    ${tog('personas','Bot personalities (applies to next game)')}
    ${tog('sound','Sound effects')}
    ${tog('haptics','Vibration')}
    ${tog('cb','Colour-blind mode (safe colours, shapes, tile patterns)')}
    ${tog('chat','Bot chat and emotes')}
    <div class="sec">Theme</div>${seg('theme',[['ocean','Ocean'],['night','Night'],['parchment','Parchment'],['meadow','Meadow']],S.theme)}
    <div class="sec">Layout</div>${seg('layout',[['auto','Auto'],['stack','Portrait'],['side','Side panel']],S.layout)}
    ${isStandalone()?'':'<div class="row"><button id="inst2" class="ghost">📲 Install on my phone</button></div>'}
    <div class="row"><button id="rl2" class="ghost">⚖️ Game rules (next game)</button></div>
    <div class="row"><button id="car2" class="ghost">🏅 Career &amp; achievements</button></div>
    <div class="row"><button id="cl" class="ghost">📜 Changelog (v${VERSION})</button></div>
    <div class="row"><button id="done">${inGame?'Close':'Done'}</button></div>
    ${inGame?'<div class="row"><button id="ng" class="ghost">Quit to menu (progress is saved)</button></div>':''}`);
  const lab=()=>{$('v1').textContent=(0.65*S.delay).toFixed(1)+'s';$('v2').textContent=S.turnPause.toFixed(1)+'s';};
  lab();
  $('r1').oninput=e=>{S.delay=+e.target.value;saveS();lab();};
  $('r2').oninput=e=>{S.turnPause=+e.target.value;saveS();lab();};
  $('mbox').querySelectorAll('input[data-t]').forEach(c=>c.onchange=()=>{S[c.dataset.t]=c.checked;saveS();if(c.dataset.t==='cb'){applyColors(S.color);if(G)render();}if(c.dataset.t==='sound'&&c.checked)sfx('trade');});
  {const pm=S.map;bindSeg(()=>{mapFix(pm);applyLayout();applyTheme();settingsModal(inGame);if(G)render();});}
  if($('inst2'))$('inst2').onclick=()=>installModal(()=>settingsModal(inGame));
  $('rl2').onclick=()=>rulesModal(()=>settingsModal(inGame));
  $('car2').onclick=()=>careerModal(()=>settingsModal(inGame));
  $('cl').onclick=()=>changelogModal(inGame);
  $('done').onclick=()=>inGame?closeModal():startModal();
  if(inGame)$('ng').onclick=function(){if(this.dataset.c)location.reload();else{this.dataset.c=1;this.textContent='Tap again to quit this game';}};
}

/* ---------- rendering ---------- */
function renderBank(){
  $('bank').innerHTML='🏦 '+RES.map(r=>`<span class="${G.bank[r]<=3?'low':''}">${EMO[r]}${G.bank[r]}</span>`).join(' ')+` · 🃏${G.deck.length}`;
}
function render(){if(!G)return;renderTop();renderBoard();renderPanel();renderBank();scheduleSave();}
function renderTop(){
  $('top').classList.toggle('many',G.n>4);
  $('top').innerHTML=G.players.map(p=>{
    const fl=G.flash&&G.flash[p.id];
    const sy=p.ai&&p.style&&S.personas?STYLES[p.style][0]:'';
    return `<div class="pl ${p.id===G.cur&&!G.over?'cur':''}" data-p="${p.id}" style="border-color:${PCOL[p.id]}"><b style="color:${PCOL[p.id]}">${S.cb?SYM[p.id]+' ':''}${PNAME[p.id]}</b>${sy} ${p.id===0?totVP(p):pubVP(p)}VP${G.lr===p.id?' 🛣️':''}${G.la===p.id?' ⚔️':''}<br>${fl?`<span class="fl">${fl}</span>`:`🃏${cards(p)} 🗡${p.knights} 🛤${G.lens[p.id]}`}</div>`;
  }).join('')+'<div></div>'.repeat(Math.max(0,4-G.n));
}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.round((n>>16)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return `rgb(${r},${g},${b})`;}
function houseSVG(x,y,c,sy){
  return `<g transform="translate(${x},${y})" stroke="#111" stroke-width="1.6" stroke-linejoin="round">
    <path d="M-8 8V-1H8V8Z" fill="${c}"/><path d="M-10 -1L0 -11L10 -1Z" fill="${shade(c,.72)}"/>
    <rect x="-2" y="2" width="4" height="6" fill="#3b2a1a" stroke="none"/>${sy?`<text x="0" y="-2.4" text-anchor="middle" font-size="7.5" font-weight="800" fill="#fff" stroke="#111" stroke-width=".5" paint-order="stroke">${sy}</text>`:''}</g>`;
}
function citySVG(x,y,c,sy){
  const dk=shade(c,.7);
  return `<g transform="translate(${x},${y})" stroke="#111" stroke-width="1.5" stroke-linejoin="round">
    <path d="M-3 9V0H14V9Z" fill="${c}"/><path d="M-4.5 0L5.5 -8L15.5 0Z" fill="${dk}"/>
    <path d="M-15 9V-6H-3V9Z" fill="${c}"/><path d="M-16.5 -6L-9 -15L-1.5 -6Z" fill="${dk}"/>
    <path d="M-9 -15V-21" stroke-width="1.3"/><path d="M-9 -21L-2 -19L-9 -17Z" fill="#ffd54f" stroke-width="1"/>
    <path d="M-12 9V4Q-9 0 -6 4V9Z" fill="#3b2a1a" stroke="none"/>
    <rect x="-12.5" y="-3.5" width="3" height="3" fill="#fff3b0" stroke="none"/><rect x="-7" y="-3.5" width="3" height="3" fill="#fff3b0" stroke="none"/>
    <rect x="2" y="3" width="3.5" height="3.5" fill="#fff3b0" stroke="none"/><rect x="8" y="3" width="3.5" height="3.5" fill="#fff3b0" stroke="none"/>
    ${sy?`<text x="-9" y="-7.6" text-anchor="middle" font-size="7" font-weight="800" fill="#fff" stroke="#111" stroke-width=".5" paint-order="stroke">${sy}</text>`:''}
  </g>`;
}
function renderBoard(){
  const hexPts=h=>h.verts.map(v=>V[v].x+','+V[v].y).join(' ');
  let s='<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff1744"/></marker>'+(S.cb?CBDEFS:'')+'</defs>';
  for(const pt of PORTS){
    const A=V[pt.a],B=V[pt.b];
    s+=`<line x1="${A.x}" y1="${A.y}" x2="${pt.px}" y2="${pt.py}" stroke="#d9c79a" stroke-width="2"/><line x1="${B.x}" y1="${B.y}" x2="${pt.px}" y2="${pt.py}" stroke="#d9c79a" stroke-width="2"/>`;
    s+=`<circle cx="${pt.px}" cy="${pt.py}" r="17" fill="#fff4d6" stroke="#8a6d3b" stroke-width="2"/>`;
    if(pt.type==='any')s+=`<text x="${pt.px}" y="${pt.py+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#333">3:1</text>`;
    else s+=`<text x="${pt.px}" y="${pt.py-1}" text-anchor="middle" font-size="12">${EMO[pt.type]}</text><text x="${pt.px}" y="${pt.py+11}" text-anchor="middle" font-size="9" font-weight="700" fill="#333">2:1</text>`;
  }
  H.forEach((h,i)=>{
    s+=`<polygon data-hx="${i}" points="${hexPts(h)}" fill="${HEXCOL[h.res]}" stroke="${h.res==='sea'?'rgba(255,255,255,.14)':'#f3e9c6'}" stroke-width="2.5"/>`;
    if(S.cb&&h.res!=='desert'&&h.res!=='sea')s+=`<polygon points="${hexPts(h)}" fill="url(#cb-${h.res})" pointer-events="none"/>`;
    if(h.res==='sea')s+=`<text x="${h.cx}" y="${h.cy+7}" text-anchor="middle" font-size="20" opacity=".16" pointer-events="none">🌊</text>`;
    else if(h.res!=='desert')s+=`<text x="${h.cx}" y="${h.cy-12}" text-anchor="middle" font-size="19">${EMO[h.res]}</text>`;
    else s+=`<text x="${h.cx}" y="${h.cy+6}" text-anchor="middle" font-size="22">🏜️</text>`;
  });
  // rolled-number highlight
  if(G.hl!==null&&!G.mode)H.forEach((h,i)=>{
    if(h.num!==G.hl)return;
    const blocked=i===G.robber;
    s+=blocked
      ?`<polygon points="${hexPts(h)}" fill="rgba(255,23,68,.25)" stroke="#ff1744" stroke-width="4" stroke-dasharray="6 5" pointer-events="none"/>`
      :`<polygon class="glow" points="${hexPts(h)}" fill="rgba(255,238,88,.38)" stroke="#fff176" stroke-width="5" pointer-events="none"/>`;
  });
  // number tokens
  H.forEach((h,i)=>{
    if(!h.num)return;
    const red=h.num===6||h.num===8,on=G.hl===h.num&&!G.mode;
    s+=`<circle cx="${h.cx}" cy="${h.cy+10}" r="${on?15:12}" fill="${on?'#ffee58':'#fbf3d9'}" stroke="${on?'#f57f17':'#8a6d3b'}" stroke-width="${on?2.5:1}"/><text x="${h.cx}" y="${h.cy+(on?16:15)}" text-anchor="middle" font-size="${on?16:13}" font-weight="800" fill="${red?'#c62828':'#222'}">${h.num}</text>`;
  });
  // roads
  for(const e of E)if(e.owner!==-1){
    const A=V[e.a],B=V[e.b];
    if(e.kind==='ship'){
      const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;let ang=Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;
      s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${PCOL[e.owner]}" stroke-width="3" stroke-dasharray="3 4" stroke-linecap="round" opacity=".85"/>`;
      s+=`<g transform="translate(${mx},${my}) rotate(${ang}) scale(1.3)"><path d="M-13 0L-9 7H9L13 0Z" fill="${PCOL[e.owner]}" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="M0 -1V-13L8 -3Z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>${S.cb?`<text x="0" y="5.6" text-anchor="middle" font-size="6" font-weight="800" fill="#fff" stroke="#111" stroke-width=".4" paint-order="stroke">${SYM[e.owner]}</text>`:''}</g>`;
      continue;
    }
    s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#222" stroke-width="10" stroke-linecap="round"/><line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${PCOL[e.owner]}" stroke-width="6" stroke-linecap="round"/>`;
    if(S.cb){const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;s+=`<circle cx="${mx}" cy="${my}" r="5.5" fill="#fff" stroke="#111" stroke-width="1"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="8" font-weight="800" fill="#111">${SYM[e.owner]}</text>`;}
  }
  // buildings (+ ring if next to a rolled tile)
  for(const v of V)if(v.owner!==-1){
    if(G.hl!==null&&!G.mode&&v.hexes.some(hi=>H[hi].num===G.hl&&hi!==G.robber))s+=`<circle class="glow" cx="${v.x}" cy="${v.y}" r="${v.city?24:17}" fill="none" stroke="#ffee58" stroke-width="3.5" pointer-events="none"/>`;
    s+=v.city?citySVG(v.x,v.y,PCOL[v.owner],S.cb?SYM[v.owner]:''):houseSVG(v.x,v.y,PCOL[v.owner],S.cb?SYM[v.owner]:'');
  }
  // robber: ring on the new tile, arrow from the old one, token
  if(G.rb){
    const A=H[G.rb.from],B=H[G.rb.to];
    const dx=B.cx-A.cx,dy=B.cy-A.cy,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    const x1=A.cx+ux*18,y1=A.cy+uy*18,x2=B.cx-ux*26,y2=B.cy-uy*26;
    s+=`<circle class="glow" cx="${B.cx}" cy="${B.cy}" r="31" fill="rgba(255,23,68,.15)" stroke="#ff1744" stroke-width="4" pointer-events="none"/>`;
    s+=`<circle cx="${A.cx}" cy="${A.cy}" r="6" fill="#ff1744" stroke="#fff" stroke-width="1.5" pointer-events="none"/>`;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="9" stroke-linecap="round" opacity=".55" pointer-events="none"/>`;
    s+=`<line class="flow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff1744" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)" pointer-events="none"/>`;
  }
  {
    const h=H[G.robber];
    s+=`<g transform="translate(${h.cx+25},${h.cy+6})" stroke="#fff" stroke-width="1.6"><path d="M-8 11Q-8 -2 0 -2Q8 -2 8 11Z" fill="#1b1b1b"/><circle cy="-8" r="6.5" fill="#1b1b1b"/></g>`;
  }
  const t=targets();
  if(t&&G.mode&&G.mode!=='robber'){
    const okE=new Set(t.e||[]),okV=new Set(t.v||[]);
    if(t.e){for(const e of E){if(okE.has(e.id))continue;const A=V[e.a],B=V[e.b];s+=`<line data-why="e${e.id}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="rgba(0,0,0,0)" stroke-width="16" stroke-linecap="round"/>`;}}
    else{for(const v of V){if(okV.has(v.id))continue;s+=`<circle data-why="v${v.id}" cx="${v.x}" cy="${v.y}" r="14" fill="rgba(0,0,0,0)"/>`;}}
  }
  if(t){
    const sel=(k,i)=>G.sel&&G.sel.kind===k&&G.sel.id===i;
    (t.h||[]).forEach(i=>{const h=H[i],sl=sel('h',i);s+=`<polygon class="${sl?'':'hit'}" data-h="${i}" points="${hexPts(h)}" fill="${sl?'rgba(0,230,118,.55)':'rgba(255,255,255,.35)'}" stroke="${sl?'#00e676':'#fff'}" stroke-width="${sl?5:3}"/>`;});
    (t.e||[]).forEach(i=>{const e=E[i],A=V[e.a],B=V[e.b],sl=sel('e',i);s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#000" stroke-width="19" stroke-linecap="round" opacity=".5" pointer-events="none"/><line class="${sl?'':'hit'}" data-e="${i}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${sl?'#00e676':'#fff'}" stroke-width="${sl?15:12}" stroke-linecap="round" opacity="${sl?1:.95}"/>`;});
    (t.v||[]).forEach(i=>{const v=V[i],sl=sel('v',i);s+=`<circle cx="${v.x}" cy="${v.y}" r="21" fill="#000" opacity=".4" pointer-events="none"/><circle class="${sl?'':'hit'}" data-v="${i}" cx="${v.x}" cy="${v.y}" r="${sl?19:15}" fill="${sl?'#00e676':'rgba(255,255,255,.92)'}" stroke="${sl?'#fff':'#0b3d5c'}" stroke-width="3"/>`;});
  }
  $('board').innerHTML=s;
}
function dieSVG(n,size){
  const P={1:[[5,5]],2:[[2.6,2.6],[7.4,7.4]],3:[[2.6,2.6],[5,5],[7.4,7.4]],4:[[2.6,2.6],[7.4,2.6],[2.6,7.4],[7.4,7.4]],5:[[2.6,2.6],[7.4,2.6],[5,5],[2.6,7.4],[7.4,7.4]],6:[[2.6,2.4],[7.4,2.4],[2.6,5],[7.4,5],[2.6,7.6],[7.4,7.6]]};
  return `<svg class="die" width="${size}" height="${size}" viewBox="0 0 10 10"><rect x=".4" y=".4" width="9.2" height="9.2" rx="1.9" fill="#fff" stroke="#333" stroke-width=".5"/>${P[n].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${n===1?1.2:.85}" fill="${n===1?'#d32f2f':'#222'}"/>`).join('')}</svg>`;
}
function renderPanel(){
  const me=G.players[0];
  let msg;
  if(G.over)msg=`${PNAME[G.winner]} won!`;
  else if(G.waiting)msg=G.waitMsg;
  else if(G.mode&&G.sel)msg='Confirm this spot?';
  else if(G.mode)msg={settle:'Tap a glowing spot for your settlement',settleSetup:'Place your starting settlement',city:'Tap a settlement to upgrade',road:'Tap a glowing spot for the road',roadSetup:'Place your starting road',ship:'Tap a glowing spot for the ship',robber:'Move the robber: tap a hex'}[G.mode];
  else if(G.phase==='setup')msg=`${PNAME[G.cur]} is placing…`;
  else if(G.cur===0&&!G.auto)msg=G.phase==='roll'?'Your turn: roll the dice':'Your turn';
  else msg=`${PNAME[G.cur]} is playing…`;
  $('msg').textContent=msg;
  $('dice').innerHTML=G.dice?`<span class="dd ${G.rolling?'tumble':''}">${dieSVG(G.dice[0],42)}${dieSVG(G.dice[1],42)}</span><span class="tot">${G.rolling?'':G.dice[0]+G.dice[1]}</span>`:'';
  const shown=G.shown||me.res,devTot=sum(me.dev)+sum(me.devNew),devNew=sum(me.devNew);
  $('hand').innerHTML=RES.map(r=>`<div class="chip" data-r="${r}">${EMO[r]}<b>${shown[r]}</b></div>`).join('')+`<div class="chip" data-r="dev" data-open="1">🃏<b>${devTot}</b>${devNew?`<i class="lock">🔒${devNew}</i>`:''}</div>`;
  if(G.waiting){
    $('btns').innerHTML='<button data-a="cont" style="grid-column:1/-1;padding:12px">Continue ▶</button>';
  }else if(G.mode&&G.sel){
    $('btns').innerHTML='<button data-a="confirm" style="grid-column:span 2;padding:12px">Confirm ✓</button><button data-a="change" class="ghost" style="grid-column:span 2;padding:12px">Change</button>';
  }else if(G.mode){
    const cancelable=!G.noCancel&&['settle','city','road','ship'].includes(G.mode);
    $('btns').innerHTML=cancelable?'<button data-a="cancel" class="ghost" style="grid-column:1/-1">Cancel</button>':'';
  }else{
    const act=canAct(),rollOK=!G.over&&G.cur===0&&!G.auto&&!G.busy&&G.phase==='roll';
    const B=[
      (G.phase==='roll'||G.cur!==0)?['roll','🎲 Roll','',rollOK]:['undo','↶ Undo',G.undo.length?({road:'road',settle:'settlement',city:'city',ship:'ship'})[G.undo[G.undo.length-1].kind]:'',act&&G.undo.length>0],
      ['road','Road','🌲🧱',act&&can(me,COST.road)&&me.roads<15],
      ['settle','Settlement','🌲🧱🐑🌾',act&&can(me,COST.settle)&&me.settles<5],
      ['city','City','🌾🌾⛰️⛰️⛰️',act&&can(me,COST.city)&&me.cities<4&&me.settles>0],
      ...(G.map==='sea'?[['ship','Ship','🌲🐑',act&&can(me,COST.ship)&&(me.ships||0)<15]]:[]),
      ['buy','Buy card','🐑🌾⛰️',act&&can(me,COST.dev)&&G.deck.length>0],
      ['cards','My cards ℹ','',G.phase!=='setup'&&!G.over],
      ['trade','Trade','',act],
      ['end','End turn','',act]
    ];
    $('btns').innerHTML=B.map(([a,l,sub,ok])=>`<button data-a="${a}" ${ok?'':'disabled'}>${l}${sub?`<small>${sub}</small>`:''}</button>`).join('');
  }
  $('log').innerHTML=G.log.slice(-8).reverse().map(x=>`<div>${colorize(logText(x))}</div>`).join('');
}

/* ---------- input ---------- */
$('board').addEventListener('click',e=>{
  const wn=e.target.closest('[data-why]');
  if(wn&&G&&G.resolve){const m=whyNot(G.mode,wn.dataset.why);if(m)toast(`<div>🚫 ${m}</div>`,2800);return;}
  const t=e.target.closest('[data-v],[data-e],[data-h]');
  if(!t||!G||!G.resolve)return;
  const d=t.dataset;
  const kind=d.v!==undefined?'v':d.e!==undefined?'e':'h',id=+(d.v!==undefined?d.v:d.e!==undefined?d.e:d.h);
  if(S.confirmPick&&['settleSetup','roadSetup','robber'].includes(G.mode)){G.sel={kind,id};render();return;}
  finishPick(id);
});
$('hand').addEventListener('click',e=>{if(G&&G.phase!=='setup'&&!G.over&&e.target.closest('[data-open]'))devModal();});
$('btns').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');
  if(!b||b.disabled||!G)return;
  const a=b.dataset.a;
  if(a==='cont'){const r=G.waiting;G.waiting=null;if(r)r();render();return;}
  if(a==='cancel'){if(G.resolve&&!G.noCancel&&['settle','city','road','ship'].includes(G.mode))finishPick(null);return;}
  if(a==='confirm'){if(G.sel&&G.resolve)finishPick(G.sel.id);return;}
  if(a==='change'){G.sel=null;render();return;}
  if(a==='undo'){undoBuild();return;}
  if(a==='roll')humanRoll();
  else if(a==='road'||a==='settle'||a==='city'||a==='ship')humanBuild(a);
  else if(a==='buy')humanBuy();
  else if(a==='cards')devModal();
  else if(a==='trade')tradeModal();
  else if(a==='end')tryEndTurn();
});
$('gear').addEventListener('click',()=>settingsModal(!!G));
$('statbtn').addEventListener('click',()=>{if(G&&G.st)statsModal('overview',false);});
const modalFree=()=>$('modal').classList.contains('hidden');
$('logbtn').addEventListener('click',()=>{if(G&&modalFree())logModal();});
$('log').addEventListener('click',()=>{if(G&&modalFree())logModal();});
$('top').addEventListener('click',e=>{const b=e.target.closest('.pl[data-p]');if(G&&b&&+b.dataset.p>0&&modalFree())botModal(+b.dataset.p);});
/* ---------- zoom & pan ---------- */
const VIEW={B:null,cx:0,cy:0,z:1};
function fitBoard(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const v of V){x0=Math.min(x0,v.x);x1=Math.max(x1,v.x);y0=Math.min(y0,v.y);y1=Math.max(y1,v.y);}
  const m=52;
  VIEW.B={x:x0-m,y:y0-m,w:x1-x0+2*m,h:y1-y0+2*m};
  VIEW.cx=VIEW.B.x+VIEW.B.w/2;VIEW.cy=VIEW.B.y+VIEW.B.h/2;VIEW.z=1;applyView();
}
function applyView(){
  const B=VIEW.B;if(!B)return;
  const w=B.w/VIEW.z,h=B.h/VIEW.z;
  VIEW.cx=Math.min(Math.max(VIEW.cx,B.x+w/2),B.x+B.w-w/2);
  VIEW.cy=Math.min(Math.max(VIEW.cy,B.y+h/2),B.y+B.h-h/2);
  $('board').setAttribute('viewBox',`${VIEW.cx-w/2} ${VIEW.cy-h/2} ${w} ${h}`);
  $('zfit').style.opacity=VIEW.z>1.02?1:.45;
}
function toSvg(x,y){
  const m=$('board').getScreenCTM&&$('board').getScreenCTM();if(!m)return null;
  const i=m.inverse();return {x:i.a*x+i.c*y+i.e,y:i.b*x+i.d*y+i.f};
}
function zoomAt(px,py,nz){
  nz=Math.min(4,Math.max(1,nz));
  const P=toSvg(px,py);
  VIEW.z=nz;applyView();
  const Q=toSvg(px,py);
  if(P&&Q){VIEW.cx+=P.x-Q.x;VIEW.cy+=P.y-Q.y;applyView();}
}
function panPx(dx,dy){
  const m=$('board').getScreenCTM&&$('board').getScreenCTM();if(!m)return;
  VIEW.cx-=dx/m.a;VIEW.cy-=dy/m.d;applyView();
}
{
  const bd=$('board'),ptrs=new Map();let moved=false,last=null;
  const pinch=()=>{const a=[...ptrs.values()];if(a.length<2)return null;return {mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};};
  bd.addEventListener('pointerdown',e=>{
    if(ptrs.size===0)moved=false;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    last=pinch();
  });
  bd.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size>=2){
      const s=pinch();moved=true;
      if(last){panPx(s.mx-last.mx,s.my-last.my);zoomAt(s.mx,s.my,VIEW.z*s.d/last.d);}
      last=s;
    }else if(VIEW.z>1.02){
      if(Math.hypot(p.x-p.sx,p.y-p.sy)>6)moved=true;
      if(moved)panPx(dx,dy);
    }
  });
  const up=e=>{ptrs.delete(e.pointerId);last=pinch();};
  bd.addEventListener('pointerup',up);bd.addEventListener('pointercancel',up);bd.addEventListener('pointerleave',up);
  bd.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  bd.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,VIEW.z*(e.deltaY<0?1.15:1/1.15));},{passive:false});
  const mid=()=>{const r=bd.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
  $('zin').onclick=()=>{const [x,y]=mid();zoomAt(x,y,VIEW.z*1.3);};
  $('zout').onclick=()=>{const [x,y]=mid();zoomAt(x,y,VIEW.z/1.3);};
  $('zfit').onclick=()=>{VIEW.z=1;VIEW.cx=VIEW.B?VIEW.B.x+VIEW.B.w/2:0;VIEW.cy=VIEW.B?VIEW.B.y+VIEW.B.h/2:0;applyView();};
}

/* ---------- save & resume ---------- */
const SAVEKEY='hexfarers.save';
let saveTimer=null;
function snapshot(){
  const g={...G,resolve:null,waiting:null,shown:null,flash:null,mode:null,sel:null,rolling:false,busy:false};
  g.st={...G.st,elapsed:Date.now()-G.st.start};
  return JSON.stringify({v:1,ver:VERSION,t:Date.now(),G:g,V,E,H,PORTS,pcol:PCOL.slice()});
}
function saveNow(){try{if(!G||G.auto||G.over)return;localStorage.setItem(SAVEKEY,snapshot());}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVEKEY);}catch(e){}}
function readSave(){
  try{
    const t=localStorage.getItem(SAVEKEY);if(!t)return null;
    const o=JSON.parse(t);
    return(o&&o.v===1&&o.G&&o.V&&o.E&&o.H&&o.G.players)?o:null;
  }catch(e){return null;}
}
const humanIdle=()=>!!G&&!G.auto&&!G.over&&G.cur===0&&!G.busy&&!G.mode&&!G.resolve&&!G.waiting&&(G.phase==='roll'||G.phase==='main');
function scheduleSave(){if(!G||G.auto)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(humanIdle())saveNow();},350);}
function loadGame(){
  const o=readSave();if(!o)return false;
  V=o.V;E=o.E;H=o.H;PORTS=o.PORTS;G=o.G;applyColors(S.color,S.cb?null:o.pcol);
  G.st.start=Date.now()-(G.st.elapsed||0);
  G.resolve=null;G.waiting=null;G.mode=null;G.sel=null;G.busy=false;G.shown=null;G.flash=null;G.rolling=false;
  fitBoard();closeModal();render();
  if(G.phase==='setup')mainFlow();
  else if(G.cur===0)toast('<b>Game resumed</b>',1000,false);
  else turnLoop();
  return true;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&humanIdle())saveNow();});
window.addEventListener('pagehide',()=>{if(humanIdle())saveNow();});

  const w=window.innerWidth,h=window.innerHeight;
  const side=S.layout==='side'||(S.layout==='auto'&&w/h>=1.3&&h<=620);
  document.body.classList.toggle('side',side);
}
