RBL={"de":{"basics":["📘 Grundspiel","<p><b>Ziel:</b> Erreiche als Erster die nötigen Siegpunkte (standardmäßig 10).</p>\n<p><b>Aufbau:</b> Alle würfeln die Reihenfolge aus. In dieser Reihenfolge setzt jeder eine Siedlung und eine Straße, dann in umgekehrter Reihenfolge ein zweites Paar. Die zweite Siedlung bringt dir 1 Karte von jedem angrenzenden Feld.</p>\n<p><b>Dein Zug:</b> Würfle (tippe auf die Würfel). Jedes Feld mit dieser Zahl bringt Ertrag: jede Siedlung an seinen Ecken erhält 1 Karte, jede Stadt 2. Dann handle und baue in beliebiger Reihenfolge und beende deinen Zug.</p>\n<p><b>Bauen:</b> Straße 🌲🧱 · Siedlung 🌲🧱🐑🌾 (1 SP) · Stadt 🌾🌾⛰️⛰️⛰️ (2 SP, ersetzt eine Siedlung) · Entwicklungskarte 🐑🌾⛰️. Siedlungen brauchen mindestens zwei Straßenlängen Abstand und müssen (nach dem Aufbau) an deine Straße anschließen.</p>\n<p><b>Sieben:</b> Wer mehr Karten als das Handlimit (7) hat, wirft die Hälfte ab. Der Würfelnde versetzt den Räuber, der ein Feld blockiert, und zieht einem Spieler dort 1 zufällige Karte.</p>\n<p><b>Handel:</b> mit anderen Spielern oder mit der Bank 4:1, 3:1 an einem 3:1-Hafen oder 2:1 an einem passenden Rohstoffhafen. Die Bank hat 19 Karten jeder Sorte (24 auf der großen Karte).</p>\n<p><b>Entwicklungskarten:</b> Ritter (versetzt den Räuber), Siegpunkt, Straßenbau, Reiche Ernte, Marktdruck. Eine pro Zug, nicht im Zug des Kaufs.</p>\n<p><b>Boni:</b> Längste Route (5+ verbundene Straßen) und Stärkste Wache (3+ gespielte Ritter) bringen je 2 SP.</p>"],"maps":["🗺️ Karten","<p><b>Standard:</b> eine zufällige Insel mit 19 Feldern für 2–4 Spieler.</p>\n<p><b>Einsteiger:</b> jedes Mal dieselbe ausgewogene Insel mit 19 Feldern.</p>\n<p><b>Groß:</b> 30 Felder für 4–6 Spieler, 24 Karten jeder Sorte in der Bank und mehr Entwicklungskarten.</p>\n<p><b>Inseln:</b> mehrere Inseln im offenen Meer. Startsiedlungen nur auf der Hauptinsel. Schiffe 🌲🐑 fahren auf Meereskanten, Straßen bleiben an Land; beide verbinden sich nur an deinen eigenen Siedlungen und Städten. Deine erste Siedlung auf jeder neuen Insel bringt +1 SP.</p>"],"barbarians":["⛵ Barbaren","<p>Nach jedem Wurf rückt die Barbarenflotte mit einer Chance von 1 zu 2 einen Schritt näher (Leiste unten links auf dem Brett). Bei Schritt 7 greift sie an.</p>\n<p><b>Angriffsstärke</b> = Anzahl der Städte auf der Insel. <b>Verteidigung</b> = alle <i>aktiven</i> Ritter: seit dem letzten Angriff gespielte Ritterkarten aller Spieler.</p>\n<p><b>Abgewehrt:</b> Wer die meisten aktiven Ritter hat, wird Verteidiger: +1 SP. Bei Gleichstand zieht jeder eine Entwicklungskarte.</p>\n<p><b>Verloren:</b> Unter den Spielern mit Stadt verlieren die mit den wenigsten aktiven Rittern je eine Stadt (sie wird zur Siedlung).</p>\n<p>Nach jedem Angriff kehren alle Ritter heim (aktive Ritter auf 0). Für die Stärkste Wache zählen sie weiter.</p>"],"fish":["🐟 Fischer","<p>Wenn ein Feld Ertrag bringt, fängt jede deiner Siedlungen und Städte an der Küste daneben zusätzlich <b>1🐟</b> (einmal pro Gebäude und Wurf; das Räuberfeld fängt nichts). Fische zählen nicht zum Handlimit und können nicht gestohlen werden.</p>\n<p>Nutze in deinem Zug die Taste 🐟 Fische: <b>2🐟</b> Räuber in die Wüste jagen · <b>4🐟</b> 1 Rohstoff deiner Wahl · <b>5🐟</b> eine Straße kostenlos · <b>7🐟</b> eine Entwicklungskarte ziehen.</p>"],"explore":["🧭 Entdecker","<p>Wird auf der Inselkarte gespielt.</p>\n<p>Alle Inseln außer der Hauptinsel liegen anfangs im Nebel. Berührt eines deiner Schiffe oder eine Straße ein Nebelfeld, wird es aufgedeckt und du erhältst 1 Karte seines Rohstoffs (Wüsten geben nichts).</p>\n<p>Inselboni gelten wie auf der Inselkarte: Deine erste Siedlung auf jeder neuen Insel bringt +1 SP. Bauten, die Felder aufdecken, lassen sich nicht rückgängig machen.</p>"],"gold":["💰 Goldfelder","<p>Wird auf der Inselkarte gespielt.</p>\n<p>Einige Felder auf den äußeren Inseln sind Goldfelder. Wird ihre Zahl gewürfelt, darfst du dir pro angrenzender Siedlung 1 Rohstoff deiner Wahl von der Bank nehmen (Stadt: 2). Der Räuber blockiert Goldfelder wie jedes andere Feld.</p>"],"about":["ℹ️ Über","<p><b>Hexfarers</b> ist ein unabhängiges Open-Source-Fanprojekt. Es ist nicht mit der CATAN GmbH oder CATAN Studio verbunden, wird von ihnen nicht unterstützt und steht in keiner Beziehung zu ihnen.</p>\n<p>Alle Grafiken sind eigene, im Code gezeichnete Arbeiten (Brett, Gebäude, Würfel, App-Symbol). Rohstoff- und andere Symbole sind Standard-Unicode-Emoji in der Schrift deines Geräts. Regeln und Texte wurden für dieses Spiel geschrieben.</p>\n<p>Copyright © 2026 dusiaclaw. Freie Software unter der GNU General Public License v3 (oder neuer): Du darfst sie unter derselben Lizenz weitergeben und ändern. Keine Gewährleistung.</p>\n<p>Quellcode: <a href=\"https://github.com/dusiaclaw/hexfarers\" target=\"_blank\" rel=\"noopener\" style=\"color:#ffd77a\">github.com/dusiaclaw/hexfarers</a></p>"]},"fr":{"basics":["📘 Jeu de base","<p><b>But :</b> être le premier à atteindre le nombre de points de victoire requis (10 par défaut).</p>\n<p><b>Mise en place :</b> chacun lance les dés pour l'ordre. Dans cet ordre, chaque joueur place une colonie et une route, puis une seconde paire dans l'ordre inverse. La seconde colonie rapporte 1 carte de chaque tuile qu'elle touche.</p>\n<p><b>Ton tour :</b> lance les dés (touche-les). Chaque tuile portant ce nombre produit : chaque colonie à ses coins reçoit 1 carte, chaque ville 2. Ensuite échange et construis dans l'ordre que tu veux, puis termine ton tour.</p>\n<p><b>Construire :</b> Route 🌲🧱 · Colonie 🌲🧱🐑🌾 (1 PV) · Ville 🌾🌾⛰️⛰️⛰️ (2 PV, remplace une colonie) · Carte développement 🐑🌾⛰️. Les colonies doivent être à au moins deux longueurs de route l'une de l'autre et (après la mise en place) reliées à ta route.</p>\n<p><b>Sept :</b> quiconque dépasse la limite de main (7) défausse la moitié. Le lanceur déplace le voleur, qui bloque une tuile, et vole 1 carte au hasard à un joueur présent.</p>\n<p><b>Échanges :</b> avec les autres joueurs, ou avec la banque à 4:1, 3:1 à un port 3:1, ou 2:1 à un port de la ressource correspondante. La banque a 19 cartes de chaque ressource (24 sur la grande carte).</p>\n<p><b>Cartes développement :</b> Chevalier (déplace le voleur), Point de victoire, Construction de routes, Récolte abondante, Coup de marché. Une par tour, pas au tour de l'achat.</p>\n<p><b>Bonus :</b> la Plus longue route (5+ routes reliées) et la Garde la plus forte (3+ chevaliers joués) valent 2 PV chacune.</p>"],"maps":["🗺️ Cartes","<p><b>Standard :</b> une île aléatoire de 19 tuiles pour 2 à 4 joueurs.</p>\n<p><b>Débutant :</b> la même île équilibrée de 19 tuiles à chaque partie.</p>\n<p><b>Grande :</b> 30 tuiles pour 4 à 6 joueurs, 24 cartes de chaque ressource à la banque et plus de cartes développement.</p>\n<p><b>Îles :</b> plusieurs îles en pleine mer. Les colonies de départ se placent uniquement sur l'île principale. Les bateaux 🌲🐑 naviguent sur les côtés maritimes, les routes restent à terre ; ils ne se rejoignent qu'à tes propres colonies et villes. Ta première colonie sur chaque nouvelle île rapporte +1 PV.</p>"],"barbarians":["⛵ Barbares","<p>Après chaque lancer, la flotte barbare a une chance sur 2 d'avancer d'une case (piste en bas à gauche du plateau). À la case 7, elle attaque.</p>\n<p><b>Force d'attaque</b> = nombre de villes sur l'île. <b>Défense</b> = tous les chevaliers <i>actifs</i> : cartes Chevalier jouées depuis la dernière attaque, par tous les joueurs.</p>\n<p><b>Repoussée :</b> le joueur avec le plus de chevaliers actifs devient défenseur : +1 PV. En cas d'égalité, chacun pioche une carte développement.</p>\n<p><b>Perdue :</b> parmi les joueurs possédant une ville, ceux qui ont le moins de chevaliers actifs perdent chacun une ville (elle redevient colonie).</p>\n<p>Après chaque attaque, tous les chevaliers rentrent (chevaliers actifs remis à 0). Ils comptent toujours pour la Garde la plus forte.</p>"],"fish":["🐟 Pêcheurs","<p>Quand une tuile produit, chacune de tes colonies ou villes côtières voisines pêche aussi <b>1🐟</b> (une fois par bâtiment et par lancer ; la tuile du voleur ne pêche rien). Les poissons ne comptent pas dans la limite de main et ne peuvent pas être volés.</p>\n<p>Utilise le bouton 🐟 Poissons pendant ton tour : <b>2🐟</b> chasser le voleur au désert · <b>4🐟</b> 1 ressource au choix · <b>5🐟</b> une route gratuite · <b>7🐟</b> piocher une carte développement.</p>"],"explore":["🧭 Explorateurs","<p>Se joue sur la carte Îles.</p>\n<p>Toutes les îles sauf la principale commencent dans le brouillard. Quand un de tes bateaux ou une route touche une tuile dans le brouillard, elle est révélée et tu reçois 1 carte de sa ressource (les déserts ne donnent rien).</p>\n<p>Les bonus d'île fonctionnent comme sur la carte Îles : ta première colonie sur chaque nouvelle île rapporte +1 PV. Les constructions qui révèlent des tuiles ne peuvent pas être annulées.</p>"],"gold":["💰 Champs d'or","<p>Se joue sur la carte Îles.</p>\n<p>Quelques tuiles des îles extérieures sont des champs d'or. Quand leur nombre sort, chaque colonie adjacente te permet de prendre 1 ressource de ton choix à la banque (ville : 2). Le voleur bloque les champs d'or comme les autres tuiles.</p>"],"about":["ℹ️ À propos","<p><b>Hexfarers</b> est un projet de fan indépendant et open source. Il n'est ni affilié à CATAN GmbH ou CATAN Studio, ni approuvé par eux, ni associé à eux.</p>\n<p>Tous les graphismes sont originaux et dessinés dans le code (plateau, bâtiments, dés, icône). Les symboles des ressources et autres sont des emoji Unicode standard affichés avec la police de ton appareil. Les règles et les textes ont été écrits pour ce jeu.</p>\n<p>Copyright © 2026 dusiaclaw. Logiciel libre sous licence GNU General Public License v3 (ou ultérieure) : tu peux le partager et le modifier sous la même licence. Aucune garantie.</p>\n<p>Code source : <a href=\"https://github.com/dusiaclaw/hexfarers\" target=\"_blank\" rel=\"noopener\" style=\"color:#ffd77a\">github.com/dusiaclaw/hexfarers</a></p>"]},"it":{"basics":["📘 Gioco base","<p><b>Obiettivo:</b> raggiungere per primo i punti vittoria richiesti (10 di base).</p>\n<p><b>Preparazione:</b> tutti tirano i dadi per l'ordine. In quell'ordine ognuno piazza un insediamento e una strada, poi in ordine inverso una seconda coppia. Il secondo insediamento dà 1 carta da ogni tessera che tocca.</p>\n<p><b>Il tuo turno:</b> tira i dadi (toccali). Ogni tessera con quel numero produce: ogni insediamento ai suoi angoli riceve 1 carta, ogni città 2. Poi scambia e costruisci nell'ordine che vuoi e termina il turno.</p>\n<p><b>Costruire:</b> Strada 🌲🧱 · Insediamento 🌲🧱🐑🌾 (1 PV) · Città 🌾🌾⛰️⛰️⛰️ (2 PV, sostituisce un insediamento) · Carta sviluppo 🐑🌾⛰️. Gli insediamenti devono distare almeno due strade e (dopo la preparazione) collegarsi a una tua strada.</p>\n<p><b>Sette:</b> chi ha più carte del limite (7) ne scarta metà. Chi ha tirato sposta il brigante, che blocca una tessera, e ruba 1 carta a caso a un giocatore lì.</p>\n<p><b>Scambi:</b> con gli altri giocatori, o con la banca a 4:1, 3:1 in un porto 3:1, o 2:1 in un porto della risorsa giusta. La banca ha 19 carte per risorsa (24 sulla mappa Grande).</p>\n<p><b>Carte sviluppo:</b> Cavaliere (sposta il brigante), Punto vittoria, Costruzione strade, Raccolto abbondante, Stretta di mercato. Una per turno, non nel turno dell'acquisto.</p>\n<p><b>Bonus:</b> Percorso più lungo (5+ strade collegate) e Guardia più forte (3+ cavalieri giocati) valgono 2 PV ciascuno.</p>"],"maps":["🗺️ Mappe","<p><b>Standard:</b> un'isola casuale di 19 tessere per 2–4 giocatori.</p>\n<p><b>Principiante:</b> la stessa isola equilibrata di 19 tessere ogni partita.</p>\n<p><b>Grande:</b> 30 tessere per 4–6 giocatori, 24 carte per risorsa in banca e più carte sviluppo.</p>\n<p><b>Isole:</b> varie isole in mare aperto. Gli insediamenti iniziali vanno solo sull'isola principale. Le navi 🌲🐑 navigano sui lati di mare, le strade restano a terra; si collegano solo ai tuoi insediamenti e città. Il tuo primo insediamento su ogni nuova isola vale +1 PV.</p>"],"barbarians":["⛵ Barbari","<p>Dopo ogni tiro la flotta barbara ha 1 probabilità su 2 di avanzare di un passo (traccia in basso a sinistra del tabellone). Al passo 7 attacca.</p>\n<p><b>Forza d'attacco</b> = numero di città sull'isola. <b>Difesa</b> = tutti i cavalieri <i>attivi</i>: carte Cavaliere giocate dall'ultimo attacco, da tutti.</p>\n<p><b>Respinto:</b> chi ha più cavalieri attivi diventa difensore: +1 PV. In caso di parità, ognuno pesca una carta sviluppo.</p>\n<p><b>Perso:</b> tra i giocatori con almeno una città, quelli con meno cavalieri attivi perdono una città ciascuno (torna insediamento).</p>\n<p>Dopo ogni attacco tutti i cavalieri tornano a casa (cavalieri attivi a 0). Contano ancora per la Guardia più forte.</p>"],"fish":["🐟 Pescatori","<p>Quando una tessera produce, ogni tuo insediamento o città sulla costa accanto pesca anche <b>1🐟</b> (una volta per edificio per tiro; la tessera del brigante non pesca). I pesci non contano per il limite di mano e non si possono rubare.</p>\n<p>Usa il pulsante 🐟 Pesci nel tuo turno: <b>2🐟</b> caccia il brigante nel deserto · <b>4🐟</b> 1 risorsa a scelta · <b>5🐟</b> una strada gratis · <b>7🐟</b> pesca una carta sviluppo.</p>"],"explore":["🧭 Esploratori","<p>Si gioca sulla mappa Isole.</p>\n<p>Tutte le isole tranne la principale partono nella nebbia. Quando una tua nave o strada tocca una tessera nella nebbia, questa viene rivelata e ricevi 1 carta della sua risorsa (i deserti non danno nulla).</p>\n<p>I bonus isola funzionano come nella mappa Isole: il tuo primo insediamento su ogni nuova isola vale +1 PV. Le costruzioni che rivelano tessere non si possono annullare.</p>"],"gold":["💰 Campi d'oro","<p>Si gioca sulla mappa Isole.</p>\n<p>Alcune tessere sulle isole esterne sono campi d'oro. Quando esce il loro numero, ogni insediamento adiacente ti fa prendere 1 risorsa a scelta dalla banca (città: 2). Il brigante blocca i campi d'oro come le altre tessere.</p>"],"about":["ℹ️ Informazioni","<p><b>Hexfarers</b> è un progetto amatoriale indipendente e open source. Non è affiliato, approvato né associato a CATAN GmbH o CATAN Studio.</p>\n<p>Tutta la grafica è originale e disegnata nel codice (tabellone, edifici, dadi, icona). I simboli delle risorse e gli altri sono emoji Unicode standard mostrate con il font del tuo dispositivo. Regole e testi sono scritti per questo gioco.</p>\n<p>Copyright © 2026 dusiaclaw. Software libero sotto GNU General Public License v3 (o successiva): puoi condividerlo e modificarlo con la stessa licenza. Nessuna garanzia.</p>\n<p>Codice sorgente: <a href=\"https://github.com/dusiaclaw/hexfarers\" target=\"_blank\" rel=\"noopener\" style=\"color:#ffd77a\">github.com/dusiaclaw/hexfarers</a></p>"]},"pl":{"basics":["📘 Gra podstawowa","<p><b>Cel:</b> jako pierwszy zdobyć wymaganą liczbę punktów zwycięstwa (domyślnie 10).</p>\n<p><b>Przygotowanie:</b> wszyscy rzucają kośćmi o kolejność. W tej kolejności każdy stawia osadę i drogę, potem w odwrotnej kolejności drugą parę. Druga osada daje po 1 karcie z każdego sąsiedniego pola.</p>\n<p><b>Twoja tura:</b> rzuć kośćmi (dotknij ich). Każde pole z tą liczbą daje plony: każda osada w jego narożnikach dostaje 1 kartę, każde miasto 2. Potem handluj i buduj w dowolnej kolejności i zakończ turę.</p>\n<p><b>Budowa:</b> Droga 🌲🧱 · Osada 🌲🧱🐑🌾 (1 PZ) · Miasto 🌾🌾⛰️⛰️⛰️ (2 PZ, zastępuje osadę) · Karta rozwoju 🐑🌾⛰️. Między osadami muszą być co najmniej dwie długości drogi, a (po przygotowaniu) muszą łączyć się z twoją drogą.</p>\n<p><b>Siódemka:</b> kto ma więcej kart niż limit (7), odrzuca połowę. Rzucający przesuwa złodzieja, który blokuje pole, i kradnie 1 losową kartę graczowi z tego pola.</p>\n<p><b>Handel:</b> z innymi graczami albo z bankiem 4:1, 3:1 w porcie 3:1 lub 2:1 w porcie danego surowca. Bank ma po 19 kart każdego surowca (24 na dużej mapie).</p>\n<p><b>Karty rozwoju:</b> Rycerz (przesuwa złodzieja), Punkt zwycięstwa, Budowa dróg, Obfite plony, Przejęcie rynku. Jedna na turę, nie w turze zakupu.</p>\n<p><b>Premie:</b> Najdłuższa trasa (5+ połączonych dróg) i Najsilniejsza straż (3+ zagranych rycerzy) dają po 2 PZ.</p>"],"maps":["🗺️ Mapy","<p><b>Standardowa:</b> losowa wyspa z 19 pól dla 2–4 graczy.</p>\n<p><b>Dla początkujących:</b> zawsze ta sama zrównoważona wyspa z 19 pól.</p>\n<p><b>Duża:</b> 30 pól dla 4–6 graczy, po 24 karty surowców w banku i więcej kart rozwoju.</p>\n<p><b>Wyspy:</b> kilka wysp na otwartym morzu. Początkowe osady stawia się tylko na wyspie głównej. Statki 🌲🐑 pływają po morskich krawędziach, drogi zostają na lądzie; łączą się tylko przy twoich osadach i miastach. Twoja pierwsza osada na każdej nowej wyspie daje +1 PZ.</p>"],"barbarians":["⛵ Barbarzyńcy","<p>Po każdym rzucie flota barbarzyńców z szansą 1 na 2 przesuwa się o krok bliżej (tor w lewym dolnym rogu planszy). Na kroku 7 atakuje.</p>\n<p><b>Siła ataku</b> = liczba miast na wyspie. <b>Obrona</b> = wszyscy <i>aktywni</i> rycerze: karty Rycerza zagrane od ostatniego ataku przez wszystkich.</p>\n<p><b>Obroniono:</b> gracz z największą liczbą aktywnych rycerzy zostaje obrońcą: +1 PZ. Przy remisie każdy z nich dobiera kartę rozwoju.</p>\n<p><b>Przegrano:</b> spośród graczy z miastem ci, którzy mają najmniej aktywnych rycerzy, tracą po jednym mieście (staje się osadą).</p>\n<p>Po każdym ataku wszyscy rycerze wracają do domu (aktywni rycerze = 0). Nadal liczą się do Najsilniejszej straży.</p>"],"fish":["🐟 Rybacy","<p>Gdy pole daje plony, każda twoja osada lub miasto na wybrzeżu obok łowi też <b>1🐟</b> (raz na budynek na rzut; pole złodzieja nic nie daje). Ryby nie liczą się do limitu kart i nie można ich ukraść.</p>\n<p>W swojej turze użyj przycisku 🐟 Ryby: <b>2🐟</b> przegoń złodzieja na pustynię · <b>4🐟</b> 1 dowolny surowiec · <b>5🐟</b> darmowa droga · <b>7🐟</b> dobierz kartę rozwoju.</p>"],"explore":["🧭 Odkrywcy","<p>Rozgrywane na mapie Wyspy.</p>\n<p>Wszystkie wyspy poza główną są na początku ukryte we mgle. Gdy twój statek lub droga dotknie pola we mgle, pole zostaje odkryte, a ty dostajesz 1 kartę jego surowca (pustynie nic nie dają).</p>\n<p>Premie wyspowe działają jak na mapie Wyspy: twoja pierwsza osada na każdej nowej wyspie daje +1 PZ. Budowli, które odkrywają pola, nie można cofnąć.</p>"],"gold":["💰 Złote pola","<p>Rozgrywane na mapie Wyspy.</p>\n<p>Kilka pól na zewnętrznych wyspach to złote pola. Gdy wypadnie ich liczba, każda sąsiednia osada pozwala wziąć z banku 1 dowolny surowiec (miasto: 2). Złodziej blokuje złote pola jak każde inne.</p>"],"about":["ℹ️ O grze","<p><b>Hexfarers</b> to niezależny projekt fanowski o otwartym kodzie. Nie jest powiązany z CATAN GmbH ani CATAN Studio, nie jest przez nie wspierany ani z nimi związany.</p>\n<p>Cała grafika jest oryginalna i rysowana w kodzie (plansza, budynki, kości, ikona). Symbole surowców i inne to standardowe emoji Unicode wyświetlane czcionką twojego urządzenia. Zasady i teksty napisano dla tej gry.</p>\n<p>Copyright © 2026 dusiaclaw. Wolne oprogramowanie na licencji GNU General Public License v3 (lub nowszej): możesz je udostępniać i zmieniać na tej samej licencji. Bez gwarancji.</p>\n<p>Kod źródłowy: <a href=\"https://github.com/dusiaclaw/hexfarers\" target=\"_blank\" rel=\"noopener\" style=\"color:#ffd77a\">github.com/dusiaclaw/hexfarers</a></p>"]}};
// map the chosen resource icons back to the defaults so lookups work with every icon style
const unremo=t=>(!S.rstyle||S.rstyle==='classic')?t:t.replace(new RegExp(RES.map(r=>EMO[r].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'),m=>EMO0[RES.find(r=>EMO[r]===m)]||m);

function trText(t){

  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentNode&&/^(SCRIPT|STYLE)$/.test(x.parentNode.nodeName)?2:1});let n;const list=[];
  while((n=w.nextNode()))list.push(n);

const BKEYS=['hexfarers.settings','hexfarers.save','hexfarers.career','hexfarers.daily'];
function exportBackup(){
  try{

    const out={app:'hexfarers',version:VERSION,date:new Date().toISOString(),data:{}};
    BKEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)out.data[k]=v;});

    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hexfarers-backup-${new Date().toISOString().slice(0,10)}.json`;

function importBackup(file,say){
  const rd=new FileReader();
  rd.onload=()=>{
    let o;try{o=JSON.parse(rd.result);}catch(e){say('This file is not a Hexfarers backup.');return;}
    if(!o||o.app!=='hexfarers'||!o.data||typeof o.data!=='object'){say('This file is not a Hexfarers backup.');return;}
    const keys=Object.keys(o.data).filter(k=>BKEYS.includes(k)&&typeof o.data[k]==='string');
    if(!keys.length){say('The backup is empty.');return;}
    modal(`<h3>📂 Load backup?</h3><div class="small">Backup from ${String(o.date||'').slice(0,10)} (v${String(o.version||'?')}). It replaces the saved game, settings and career on this device.</div>
      <div class="row"><button id="bky">Load backup</button><button id="bkn" class="ghost">Cancel</button></div>`);
    $('bkn').onclick=()=>settingsModal(!!G,'more');
    $('bky').onclick=()=>{try{BKEYS.forEach(k=>localStorage.removeItem(k));keys.forEach(k=>localStorage.setItem(k,o.data[k]));}catch(e){say('Could not restore the backup.');return;}location.reload();};
  };
  rd.onerror=()=>say('Could not read the file.');
  rd.readAsText(file);
}

  const kind=d.v!==undefined?'v':d.e!==undefined?'e':'h',id=+(d.v!==undefined?d.v:d.e!==undefined?d.e:d.h);

  if(!b||b.disabled||!G)return;
  const a=b.dataset.a;
  if(a==='cont'){const r=G.waiting;G.waiting=null;if(r)r();render();return;}
  if(a==='cancel'){if(G.resolve&&!G.noCancel&&['settle','city','road','ship'].includes(G.mode))finishPick(null);return;}
  if(a==='confirm'){if(G.sel&&G.resolve)finishPick(G.sel.id);return;}

  if(a==='roll')humanRoll();
  else if(a==='road'||a==='settle'||a==='city'||a==='ship')humanBuild(a);
  else if(a==='buy')humanBuy();

  else if(a==='trade')tradeModal();

/* ---------- zoom & pan ---------- */
const VIEW={B:null,cx:0,cy:0,z:1};
function fitBoard(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const v of V){x0=Math.min(x0,v.x);x1=Math.max(x1,v.x);y0=Math.min(y0,v.y);y1=Math.max(y1,v.y);}
  const m=52;
  VIEW.B={x:x0-m,y:y0-m,w:x1-x0+2*m,h:y1-y0+2*m};
  VIEW.cx=VIEW.B.x+VIEW.B.w/2;VIEW.cy=VIEW.B.y+VIEW.B.h/2;VIEW.z=1;applyView();
}
function applyView(){
  const B=VIEW.B;if(!B)return;
  const w=B.w/VIEW.z,h=B.h/VIEW.z;
  VIEW.cx=Math.min(Math.max(VIEW.cx,B.x+w/2),B.x+B.w-w/2);
  VIEW.cy=Math.min(Math.max(VIEW.cy,B.y+h/2),B.y+B.h-h/2);
  $('board').setAttribute('viewBox',`${VIEW.cx-w/2} ${VIEW.cy-h/2} ${w} ${h}`);
  $('zfit').style.opacity=VIEW.z>1.02?1:.45;
}
function toSvg(x,y){
  const m=$('board').getScreenCTM&&$('board').getScreenCTM();if(!m)return null;
  const i=m.inverse();return {x:i.a*x+i.c*y+i.e,y:i.b*x+i.d*y+i.f};
}
function zoomAt(px,py,nz){
  nz=Math.min(4,Math.max(1,nz));
  const P=toSvg(px,py);
  VIEW.z=nz;applyView();
  const Q=toSvg(px,py);
  if(P&&Q){VIEW.cx+=P.x-Q.x;VIEW.cy+=P.y-Q.y;applyView();}
}
function panPx(dx,dy){
  const m=$('board').getScreenCTM&&$('board').getScreenCTM();if(!m)return;
  VIEW.cx-=dx/m.a;VIEW.cy-=dy/m.d;applyView();
}
{
  const bd=$('board'),ptrs=new Map();let moved=false,last=null;
  const pinch=()=>{const a=[...ptrs.values()];if(a.length<2)return null;return {mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};};
  bd.addEventListener('pointerdown',e=>{
    if(ptrs.size===0)moved=false;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    last=pinch();
  });
  bd.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size>=2){
      const s=pinch();moved=true;
      if(last){panPx(s.mx-last.mx,s.my-last.my);zoomAt(s.mx,s.my,VIEW.z*s.d/last.d);}
      last=s;
    }else if(VIEW.z>1.02){
      if(Math.hypot(p.x-p.sx,p.y-p.sy)>6)moved=true;
      if(moved)panPx(dx,dy);
    }
  });
  const up=e=>{ptrs.delete(e.pointerId);last=pinch();};
  bd.addEventListener('pointerup',up);bd.addEventListener('pointercancel',up);bd.addEventListener('pointerleave',up);
  bd.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  bd.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,VIEW.z*(e.deltaY<0?1.15:1/1.15));},{passive:false});
  const mid=()=>{const r=bd.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
  $('zin').onclick=()=>{const [x,y]=mid();zoomAt(x,y,VIEW.z*1.3);};
  $('zout').onclick=()=>{const [x,y]=mid();zoomAt(x,y,VIEW.z/1.3);};
  $('zfit').onclick=()=>{VIEW.z=1;VIEW.cx=VIEW.B?VIEW.B.x+VIEW.B.w/2:0;VIEW.cy=VIEW.B?VIEW.B.y+VIEW.B.h/2:0;applyView();};
}

/* ---------- save & resume ---------- */
const SAVEKEY='hexfarers.save';
let saveTimer=null;
function snapshot(){
  const g={...G,resolve:null,waiting:null,shown:null,flash:null,mode:null,sel:null,rolling:false,busy:false};
  g.st={...G.st,elapsed:Date.now()-G.st.start};
  return JSON.stringify({v:1,ver:VERSION,t:Date.now(),G:g,V,E,H,PORTS,pcol:PCOL.slice()});
}
function saveNow(){try{if(!G||G.auto||G.over)return;localStorage.setItem(SAVEKEY,snapshot());}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVEKEY);}catch(e){}}
function readSave(){
  try{
    const t=localStorage.getItem(SAVEKEY);if(!t)return null;
    const o=JSON.parse(t);
    return(o&&o.v===1&&o.G&&o.V&&o.E&&o.H&&o.G.players)?o:null;
  }catch(e){return null;}
}
const humanIdle=()=>!!G&&!G.auto&&!G.over&&G.cur===0&&!G.busy&&!G.mode&&!G.resolve&&!G.waiting&&(G.phase==='roll'||G.phase==='main');
function scheduleSave(){if(!G||G.auto)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(humanIdle())saveNow();},350);}
function loadGame(){
  const o=readSave();if(!o)return false;
  V=o.V;E=o.E;H=o.H;PORTS=o.PORTS;G=o.G;applyColors(S.color,S.cb?null:o.pcol);
  if(!G.order)G.order=[...Array(G.n).keys()];
  G.st.start=Date.now()-(G.st.elapsed||0);
  G.resolve=null;G.waiting=null;G.mode=null;G.sel=null;G.busy=false;G.shown=null;G.flash=null;G.rolling=false;
  hideTitle();fitBoard();closeModal();render();
  if(G.phase==='setup')mainFlow();
  else if(G.cur===0)toast('<b>Game resumed</b>',1000,false);
  else turnLoop();
  return true;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&humanIdle())saveNow();});
window.addEventListener('pagehide',()=>{if(humanIdle())saveNow();});

}
